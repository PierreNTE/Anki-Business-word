{i:85,en:"Consumption-based pricing",fr:"Tarification à l'usage",type:"noun",cat:"Sales",tags:["sales","pricing"],exp:"Pricing model where you pay for what you actually use.",ex:"Consumption-based pricing lowers the barrier to entry for new customers.",ex2:"Snowflake popularized consumption pricing in the data space.",ipa:"/kənˈsʌmp.ʃən beɪst ˈpraɪs.ɪŋ/",tip:"« keun-SAMP-shun beïst PRAÏ-sing ».",syn:["usage-based pricing","pay-as-you-go"],err:"Consumption ≠ flat subscription : la facture peut varier chaque mois.",mem:"Tu paies ce que tu CONSOMMES.",alts:["tarification a l'usage","tarification à l'usage","pay as you go","consumption based pricing"]},
{i:86,en:"Customer success",fr:"Succès client",type:"noun",cat:"Customer Success",tags:["customer-success"],exp:"Ensuring customers reach their desired business outcomes with your product.",ex:"Customer success is about outcomes, not just satisfaction.",ex2:"CS teams own renewal, adoption, and expansion in most modern SaaS companies.",ipa:"/ˈkʌs.tə.mər səkˈses/",tip:"« KAS-teu-meur seuk-SES ».",syn:["CS"],err:"CS ≠ support : le support résout des tickets ; CS pilote la valeur.",mem:"Ton succès = mon succès.",alts:["succes client","succès client","customer success","cs"]},
{i:87,en:"To touch base",fr:"Reprendre contact",type:"expression",cat:"Meetings",tags:["meetings","sales","stakeholders"],exp:"To briefly reconnect with someone to check in.",ex:"I'll touch base with you next week to align before the QBR.",ex2:"Let's touch base on Monday to review the action items.",ipa:"/tʌtʃ beɪs/",tip:"« teutch béice ». Le son /ʌ/ de touch est court, comme dans « cup ».",syn:["check in","sync up"],err:"Pas « touch the base » : l'expression est sans article.",mem:"Toucher la base (baseball) = revenir au point de départ.",alts:["reprendre contact","faire un point","prendre des nouvelles"]},
{i:88,en:"Follow-up",fr:"Relance / Suivi",type:"noun",cat:"Sales",tags:["sales","meetings","prospecting"],exp:"A message or meeting after an initial conversation to keep things moving.",ex:"I'll send a follow-up email by end of day with the recap and next steps.",ex2:"Most deals are won in the follow-up, not in the first meeting.",ipa:"/ˈfɒl.oʊ ʌp/",tip:"« FO-loh ap ». Stress sur FO.",syn:["next step","recap"],err:"Verbe : « to follow up » (deux mots) ; nom : « follow-up » (avec tiret).",mem:"Tu suis (follow) après (up) la première interaction.",alts:["relance","suivi","follow-up","follow up"]},
{i:89,en:"Roadmap",fr:"Feuille de route",type:"noun",cat:"Sales",tags:["sales","product","strategy"],exp:"A high-level plan of upcoming features and milestones.",ex:"Sharing the product roadmap built trust with the technical buyer.",ex2:"Never commit roadmap dates to a customer without product sign-off.",ipa:"/ˈroʊd.mæp/",tip:"« ROUD-map ». Un seul mot, accent sur ROUD.",syn:["product plan","timeline"],err:"Un roadmap = direction, pas une promesse contractuelle.",mem:"La carte de la route à venir.",alts:["feuille de route","roadmap"]},
{i:90,en:"Customer journey",fr:"Parcours client",type:"noun",cat:"Customer Success",tags:["customer-success","marketing"],exp:"The full sequence of stages a customer goes through with your brand.",ex:"We mapped the customer journey from first touch to expansion.",ex2:"Every churn signal sits somewhere in the customer journey.",ipa:"/ˈkʌs.tə.mər ˈdʒɜːr.ni/",tip:"« KAS-teu-meur DJEUR-ni ».",syn:["buyer journey","lifecycle"],err:"Customer journey ≠ sales funnel : le journey couvre post-vente aussi.",mem:"Le voyage complet de ton client.",alts:["parcours client","customer journey"]},
{i:91,en:"Business outcomes",fr:"Résultats business",type:"noun",cat:"Customer Success",tags:["customer-success","sales","strategy"],exp:"Measurable results that matter to the customer's business.",ex:"Every meeting must tie back to the customer's business outcomes.",ex2:"Activity metrics only matter when they connect to business outcomes.",ipa:"/ˈbɪz.nəs ˈaʊt.kʌmz/",tip:"« BIZ-nes AOUT-kams ».",syn:["business results","KPIs"],err:"Logins, MAUs, et features sont des outputs — pas des outcomes.",mem:"Le résultat (outcome) côté business, pas côté produit.",alts:["resultats business","résultats business","business outcomes","resultats metiers"]},
{i:92,en:"AI-powered",fr:"Propulsé par l'IA",type:"adjective",cat:"AI",tags:["ai","marketing"],exp:"A product that uses AI as a core component of its features.",ex:"Their AI-powered assistant cuts support resolution time in half.",ex2:"Buyers are skeptical of AI-powered claims without proof — show the outcome.",ipa:"/eɪ aɪ ˈpaʊ.ərd/",tip:"« EY-AÏ PAOU-eurd ».",syn:["AI-driven","AI-enabled"],err:"« AI-powered » est devenu vague : précisez quel modèle, quelle valeur.",mem:"Le moteur (power) du produit est de l'IA.",alts:["propulse par l'ia","propulsé par l'ia","alimente par ia","alimenté par ia","ai-powered"]},
{i:93,en:"Scalable",fr:"Évolutif / Scalable",type:"adjective",cat:"Cloud",tags:["cloud","architecture","sales"],exp:"Able to grow to handle more demand without breaking.",ex:"Our solution is scalable from 10 to 100,000 users without re-architecting.",ex2:"Scalability claims without proof are a red flag in technical reviews.",ipa:"/ˈskeɪ.lə.bəl/",tip:"« SKÉI-leu-beul ». Stress sur SKEÏ.",syn:["elastic","extensible"],err:"« Scalable » est un adjectif ; « scalability » est le nom associé.",mem:"Capable de monter l'échelle (scale).",alts:["scalable","evolutif","évolutif","passage a l'echelle","passage à l'échelle"]},
{i:94,en:"Retention",fr:"Rétention",type:"noun",cat:"Metrics",tags:["metrics","customer-success"],exp:"Keeping customers or users instead of losing them.",ex:"Retention is the single biggest driver of long-term SaaS growth.",ex2:"Gross retention removes upsell; net retention includes it.",ipa:"/rɪˈten.ʃən/",tip:"« ri-TEN-shun ». Stress sur TEN.",syn:["customer retention"],err:"Retention ≠ engagement : on peut être engagé mais churner.",mem:"Garder (retain) les clients.",alts:["retention","rétention"]},
{i:95,en:"Stakeholder buy-in",fr:"Adhésion des parties prenantes",type:"noun",cat:"Sales",tags:["sales","stakeholders","negotiation"],exp:"Active support and approval from all key people for a project.",ex:"Without stakeholder buy-in, the rollout will stall in week two.",ex2:"Securing buy-in from finance and IT is the toughest part of enterprise sales.",ipa:"/ˈsteɪkˌhoʊl.dər baɪ ɪn/",tip:"« STÉIK-hold-eur BAÏ-in ».",syn:["alignment","executive support"],err:"Un email d'accord ≠ vrai buy-in ; il faut un engagement actif.",mem:"Acheter (buy) l'adhésion des parties prenantes.",alts:["adhesion des parties prenantes","adhésion des parties prenantes","stakeholder buy-in","adhesion"]},
{i:96,en:"To close a deal",fr:"Conclure un deal",type:"verb",cat:"Sales",tags:["sales","negotiation"],exp:"To finalize and sign a sales agreement.",ex:"We closed the deal last Friday after a three-month cycle.",ex2:"You close deals by helping customers buy, not by pushing harder.",ipa:"/kloʊz ə diːl/",tip:"« kloze a dil ». 'close' (verbe) avec /z/ final, pas /s/.",syn:["sign a contract","win a deal"],err:"« Close » /kloʊs/ (adj) = proche ; « close » /kloʊz/ (verbe) = fermer.",mem:"On ferme (close) la boucle commerciale.",alts:["conclure un deal","signer un contrat","fermer un deal","closer un deal"]},
{i:97,en:"To reach out",fr:"Prendre contact",type:"phrasal verb",cat:"Sales",tags:["sales","prospecting","meetings"],exp:"To proactively contact someone, especially by email or message.",ex:"I'll reach out to the CFO this week to set up an intro call.",ex2:"Reach out to me if you have any questions before the demo.",ipa:"/riːtʃ aʊt/",tip:"« RITCH-aout ». Liaison fluide.",syn:["contact","get in touch"],err:"Au passé : « I reached out », pas « I reach-outed ».",mem:"Tendre la main (reach) vers quelqu'un.",alts:["prendre contact","contacter","faire signe","reach out"]},
{i:98,en:"To loop in",fr:"Inclure (en copie)",type:"phrasal verb",cat:"Meetings",tags:["meetings","stakeholders"],exp:"To include someone in a conversation or email thread.",ex:"Let me loop in our CS team so they can take it from here.",ex2:"Always loop in Legal before sending a redlined contract back.",ipa:"/luːp ɪn/",tip:"« LOUP-in ». 'oo' long comme « food ».",syn:["include","CC"],err:"« Loop in » prend un complément (someone) : « loop me in ».",mem:"Ajouter quelqu'un dans la boucle de discussion.",alts:["inclure","mettre en copie","ajouter en copie","loop in","boucler"]},
{i:99,en:"To circle back",fr:"Revenir vers (quelqu'un)",type:"phrasal verb",cat:"Meetings",tags:["meetings","sales","stakeholders"],exp:"To return to a topic or person later with an update or answer.",ex:"Let me circle back with the answer once I've checked with Product.",ex2:"I'll circle back on pricing after the procurement review.",ipa:"/ˈsɜːr.kəl bæk/",tip:"« SEUR-keul bak ».",syn:["follow up","get back to you"],err:"Souvent surutilisé en réunion — préférez « I'll get back to you » par écrit.",mem:"Faire un cercle et revenir.",alts:["revenir vers","faire un retour","recontacter","circle back"]},
{i:100,en:"Deal slipping",fr:"Deal qui glisse",type:"expression",cat:"Sales",tags:["sales","forecasting","meetings"],exp:"When a deal expected to close in the current period moves to the next.",ex:"Three deals are slipping into next quarter — we need a recovery plan.",ex2:"Deals slip when there's no close plan or no executive sponsor.",ipa:"/diːl ˈslɪp.ɪŋ/",tip:"« dil SLIP-ing ».",syn:["slipped deal","pushed-out deal"],err:"« Slipping » ≠ perdu : le deal n'est pas mort, il est en retard.",mem:"Le deal glisse hors du trimestre.",alts:["deal qui glisse","deal repousse","deal repoussé","slip","glissement de deal"]},
{i:101,en:"Tremendous",fr:"Énorme / Considérable",type:"adjective",cat:"Expressions",tags:["adjective","emphasis","sales","executive"],exp:"Very large in amount, scale or impact — used positively by execs and in sales pitches.",ex:"There's tremendous upside if we land just two of these enterprise accounts.",ex2:"The team has made tremendous progress on the onboarding flow this quarter.",ipa:"/trɪˈmen.dəs/",tip:"« tri-MEN-deuss ». Stress sur MEN. Évitez « tré-MAN-douss » à la française.",syn:["huge","massive","significant","substantial"],err:"Évitez « very tremendous » : le mot est déjà superlatif.",mem:"Tremendous → tremblement → impact qui fait trembler.",alts:["enorme","énorme","considerable","considérable","tremendous","massif"]},
{i:102,en:"Robust",fr:"Solide / Robuste",type:"adjective",cat:"Expressions",tags:["adjective","product","engineering","sales"],exp:"Strong, well-built, able to handle real-world load or pushback.",ex:"We need a more robust pipeline before we forecast the quarter.",ex2:"Their API is robust enough to handle our enterprise volumes.",ipa:"/roʊˈbʌst/",tip:"« roh-BUSST ». Stress sur la 2e syllabe, pas « RO-buste ».",syn:["solid","resilient","strong"],err:"« Robust » se prononce avec stress final en anglais, contrairement au français « robuste ».",mem:"Pensez à un robot bien bâti : ro-BUST.",alts:["robuste","solide","fiable","resilient","résilient"]},
{i:103,en:"Seamless",fr:"Fluide / Sans friction",type:"adjective",cat:"Customer Success",tags:["adjective","product","cx","onboarding"],exp:"Smooth and uninterrupted, especially across systems or steps.",ex:"The SSO integration makes the login flow completely seamless for end users.",ex2:"We want a seamless handoff from Sales to Customer Success.",ipa:"/ˈsiːm.ləs/",tip:"« SIIM-less ». 'ea' = ii long.",syn:["smooth","frictionless","integrated"],err:"« Seamless » décrit l'expérience, pas la difficulté du build derrière.",mem:"Sans couture (seam = couture) = fluide.",alts:["fluide","sans friction","sans accroc","seamless","transparent"]},
{i:104,en:"Compelling",fr:"Convaincant / Percutant",type:"adjective",cat:"Sales",tags:["adjective","sales","pitch","executive"],exp:"Strong enough to grab attention and drive action — typically about a pitch, case or story.",ex:"We need a more compelling business case before we go to the CFO.",ex2:"Her demo was compelling — the CTO leaned in within the first 90 seconds.",ipa:"/kəmˈpel.ɪŋ/",tip:"« keum-PEL-ling ». Stress sur PEL.",syn:["persuasive","powerful","convincing"],err:"« Compelling reason » est presque un cliché : variez avec « strong rationale ».",mem:"Compelling → ça vous pousse (compel) à agir.",alts:["convaincant","percutant","persuasif","compelling"]},
{i:105,en:"Granular",fr:"Détaillé / Fin",type:"adjective",cat:"Metrics",tags:["adjective","analytics","data","reporting"],exp:"At a fine level of detail — often about data, reporting or permissions.",ex:"Can you give me a more granular breakdown of churn by segment?",ex2:"The dashboard lets you drill down to granular activity at the user level.",ipa:"/ˈɡræn.jə.lɚ/",tip:"« GRAN-you-leur ». 'a' court comme dans « cat ».",syn:["detailed","fine-grained","specific"],err:"« Granular » s'applique aux données, pas aux personnes (« a granular person » ✗).",mem:"Comme du sable : beaucoup de petits grains de détail.",alts:["granulaire","detaille","détaillé","fin","precis","précis"]},
{i:106,en:"Actionable",fr:"Exploitable / Concret",type:"adjective",cat:"Metrics",tags:["adjective","insights","reporting","strategy"],exp:"Specific enough that someone can actually do something with it — about insights, feedback or next steps.",ex:"That feedback is interesting but not actionable — what should we change?",ex2:"Every QBR should end with three actionable next steps and owners.",ipa:"/ˈæk.ʃə.nə.bəl/",tip:"« AK-cheu-na-beul ». 4 syllabes, stress sur AK.",syn:["practical","concrete","useful"],err:"« Actionable insight » est devenu cliché : préférez « insight we can act on ».",mem:"Action + able = sur lequel on peut agir.",alts:["exploitable","concret","actionnable","actionable"]},
{i:107,en:"Significantly",fr:"De manière significative",type:"adverb",cat:"Metrics",tags:["adverb","data","executive","reporting"],exp:"By a meaningful amount — used to qualify a measurable change.",ex:"Activation rates improved significantly after we shipped the new onboarding.",ex2:"Pipeline coverage is significantly below where we need to be for Q4.",ipa:"/sɪɡˈnɪf.ɪ.kənt.li/",tip:"« sig-NIF-i-keunt-li ». Stress sur NIF.",syn:["materially","substantially","meaningfully"],err:"Ne dites pas « significantly » pour « importantly » : ça parle d'ampleur, pas d'importance.",mem:"Significant → grosse différence chiffrée.",alts:["significativement","de maniere significative","de manière significative","notablement"]},
{i:108,en:"Ultimately",fr:"En fin de compte / Au final",type:"adverb",cat:"Expressions",tags:["adverb","executive","strategy","meetings"],exp:"In the end, after everything is considered — used to bring a discussion to its core point.",ex:"Ultimately, the question is whether we have product-market fit in this segment.",ex2:"We tested three pricing models, but ultimately the per-seat model won.",ipa:"/ˈʌl.tə.mət.li/",tip:"« UL-teu-meut-li ». 4 syllabes, 'u' court comme dans « cup ».",syn:["in the end","at the end of the day","eventually"],err:"« Ultimately » ≠ « finally » (= dernier dans une liste).",mem:"Ultimate → le point ultime du raisonnement.",alts:["en fin de compte","finalement","au final","ultimement","en definitive","en définitive"]},
{i:109,en:"Proactively",fr:"De manière proactive / En anticipant",type:"adverb",cat:"Customer Success",tags:["adverb","cs","communication","executive"],exp:"Before being asked — anticipating an issue or need.",ex:"Let's proactively reach out to the top 20 accounts before renewal season.",ex2:"She proactively flagged the security gap before the audit.",ipa:"/proʊˈæk.tɪv.li/",tip:"« pro-AK-tiv-li ». Stress sur AK.",syn:["ahead of time","preemptively"],err:"Évitez d'en abuser dans les emails — « proactively » sonne corporate.",mem:"Pro = avant + active = agir.",alts:["proactivement","de maniere proactive","de manière proactive","en anticipant"]},
{i:110,en:"Strategically",fr:"Stratégiquement",type:"adverb",cat:"Expressions",tags:["adverb","strategy","executive","planning"],exp:"In a way that's aligned with broader long-term goals.",ex:"We need to strategically pick which segments we double down on next year.",ex2:"This hire is strategically important — they own our new EMEA motion.",ipa:"/strəˈtiː.dʒɪk.li/",tip:"« streu-TII-djik-li ». 'a' devient un schwa.",syn:["deliberately","with intent"],err:"« Strategic » est sur-utilisé : si tout est « strategic », rien ne l'est.",mem:"Strategy → comme aux échecs, chaque coup compte.",alts:["strategiquement","stratégiquement","de facon strategique","de façon stratégique"]},
{i:111,en:"To sum up",fr:"Pour résumer / En résumé",type:"expression",cat:"Meetings",tags:["expression","meetings","executive","communication"],exp:"Used to introduce a brief summary at the end of a discussion or pitch.",ex:"To sum up: we ship the beta in May, GA in July, with three pilot customers committed.",ex2:"To sum up, the data points to a pricing problem, not a positioning problem.",ipa:"/tə sʌm ʌp/",tip:"« teu SOM op ». 'u' court, comme dans « sun ».",syn:["in summary","to recap","in short"],err:"« To sum up » prend rarement un complément direct — c'est une transition, pas un verbe à objet.",mem:"Add things up → sum → résumé.",alts:["pour resumer","pour résumer","en resume","en résumé","en bref","recapitulons","récapitulons"]},
{i:112,en:"At the end of the day",fr:"En fin de compte / Au final",type:"expression",cat:"Meetings",tags:["expression","executive","meetings"],exp:"Used to bring a discussion back to its core point, ignoring secondary details.",ex:"At the end of the day, the customer just wants a faster time-to-value.",ex2:"At the end of the day, we either hit the number or we don't.",ipa:"/æt ði end əv ðə deɪ/",tip:"« att thi end ov theu DEY ». Liaison fluide.",syn:["ultimately","when all is said and done"],err:"Surutilisé en réunion — alternez avec « ultimately » ou « bottom line ».",mem:"À la fin de la journée, ce qui compte vraiment.",alts:["en fin de compte","au final","au bout du compte","in fine"]},
{i:113,en:"Move the needle",fr:"Faire bouger les choses / Avoir un vrai impact",type:"expression",cat:"Metrics",tags:["expression","strategy","executive","impact"],exp:"To produce a noticeable, measurable change on a key metric.",ex:"Will this feature actually move the needle on activation, or is it just a nice-to-have?",ex2:"Cutting onboarding from 14 days to 3 really moved the needle on NRR.",ipa:"/muːv ðə ˈniː.dəl/",tip:"« mouv theu NII-deul ». Le 'd' est presque un 't' doux en anglais US.",syn:["have impact","drive results"],err:"Si le résultat est faible, dites « doesn't really move the needle ».",mem:"L'aiguille (needle) d'un cadran qui bouge → impact mesurable.",alts:["faire bouger les choses","avoir un impact","deplacer l'aiguille","déplacer l'aiguille","faire la difference","faire la différence"]},
{i:114,en:"Low-hanging fruit",fr:"Gain rapide / Tâche facile",type:"expression",cat:"Expressions",tags:["expression","strategy","prioritization"],exp:"An easy win — something quick to do with clear payoff.",ex:"Fixing those three onboarding emails is low-hanging fruit — let's ship it this sprint.",ex2:"We exhausted the low-hanging fruit; the next wins will take real engineering work.",ipa:"/ˌloʊ ˈhæŋ.ɪŋ fruːt/",tip:"« lo HANG-ing frout ». Sans accent sur fruit (un seul syllabe).",syn:["quick win","easy win"],err:"À éviter au pluriel : on dit « low-hanging fruit » (singulier collectif).",mem:"Le fruit le plus bas sur l'arbre est le plus facile à cueillir.",alts:["gain rapide","tache facile","tâche facile","quick win","facile à faire","facile a faire"]},
{i:115,en:"Drill down",fr:"Approfondir / Creuser",type:"phrasal verb",cat:"Meetings",tags:["expression","analytics","meetings"],exp:"To look more closely at a specific subset, especially in data.",ex:"Let's drill down into the EMEA numbers — that's where the gap is.",ex2:"Can we drill down on why activation drops on day 3?",ipa:"/drɪl daʊn/",tip:"« dril DAWN ». 'i' court.",syn:["dig into","zoom in","deep-dive"],err:"« Drill down on » + sujet ; « drill into » + données.",mem:"Comme une perceuse qui creuse dans la donnée.",alts:["approfondir","creuser","zoomer sur","plonger dans"]},
{i:116,en:"Deep dive",fr:"Analyse approfondie",type:"noun",cat:"Meetings",tags:["expression","analytics","meetings","strategy"],exp:"A detailed, focused exploration of a topic — often a dedicated session.",ex:"Let's schedule a deep dive on the pricing model with Finance next week.",ex2:"The deep dive surfaced two churn drivers we hadn't seen in the aggregate.",ipa:"/diːp daɪv/",tip:"« diip DAYV ». 'ee' = ii long.",syn:["thorough analysis","detailed review"],err:"« Deep-dive » (verbe) ou « deep dive » (nom) ; en réunion, c'est plus souvent le nom.",mem:"Plongée profonde dans un sujet.",alts:["analyse approfondie","plongee","plongée","etude approfondie","étude approfondie","deep dive"]},
{i:117,en:"Get on the same page",fr:"Se mettre d'accord / Aligner",type:"expression",cat:"Meetings",tags:["expression","alignment","meetings","stakeholders"],exp:"To reach shared understanding among stakeholders.",ex:"Before we talk to the customer, let's get on the same page internally.",ex2:"Sales and Product need to get on the same page about Q3 priorities.",ipa:"/ɡet ɒn ðə seɪm peɪdʒ/",tip:"« guett on theu seym PEYDJ ».",syn:["align","sync up"],err:"« On the same page » ≠ « of the same opinion » : c'est plus large (mêmes faits, mêmes priorités).",mem:"Lire le même paragraphe = même compréhension.",alts:["se mettre d'accord","aligner","s'aligner","etre sur la meme longueur d'onde","être sur la même longueur d'onde"]},
{i:118,en:"Push back",fr:"Objecter / Contester",type:"phrasal verb",cat:"Negotiation",tags:["expression","negotiation","meetings","stakeholders"],exp:"To express disagreement with a decision, request or price.",ex:"The buyer pushed back hard on our discount structure.",ex2:"It's healthy when engineers push back on unrealistic timelines.",ipa:"/pʊʃ bæk/",tip:"« pouch BAK ». 'u' comme dans « book ».",syn:["object","challenge","resist"],err:"« Pushback » (un mot, nom) ≠ « push back » (verbe en deux mots).",mem:"Pousser en sens inverse = contester.",alts:["objecter","contester","resister","résister","s'opposer","pushback"]},
{i:119,en:"Get buy-in",fr:"Obtenir l'adhésion",type:"expression",cat:"Negotiation",tags:["expression","stakeholders","executive","alignment"],exp:"To secure agreement and support from key stakeholders before moving forward.",ex:"We need to get buy-in from Legal and Security before we can sign.",ex2:"Without exec buy-in, this initiative will stall by mid-quarter.",ipa:"/ɡet ˈbaɪ.ɪn/",tip:"« guett BAY-in ». Stress sur BAY.",syn:["secure support","get sign-off"],err:"« Buy-in » avec trait d'union (nom). « Buy in » sans trait d'union (verbe).",mem:"Les gens « achètent » votre idée = adhèrent.",alts:["obtenir l'adhesion","obtenir l'adhésion","faire adherer","faire adhérer","embarquer","aligner les parties"]},
{i:120,en:"Align on",fr:"S'aligner sur",type:"phrasal verb",cat:"Meetings",tags:["expression","alignment","meetings"],exp:"To reach agreement on a specific point or decision.",ex:"Can we align on the launch date before we leave this call?",ex2:"We aligned on three key metrics for the pilot phase.",ipa:"/əˈlaɪn ɒn/",tip:"« eu-LAYN on ». Stress sur LAYN.",syn:["agree on","sync on"],err:"« Align on » + sujet précis ; « align with » + personne/équipe.",mem:"Mettre en ligne = s'accorder.",alts:["s'aligner sur","s'accorder sur","se mettre d'accord sur","aligner"]},
{i:121,en:"Bandwidth",fr:"Disponibilité / Capacité",type:"noun",cat:"Meetings",tags:["expression","workload","meetings","prioritization"],exp:"The time or mental capacity someone has to take on more work.",ex:"I don't have the bandwidth to own that project this quarter.",ex2:"Do you have bandwidth for a 30-minute discovery call on Thursday?",ipa:"/ˈbænd.wɪdθ/",tip:"« BAND-witth ». Le 'dth' final est délicat — un son 'd' suivi de 'th' doux.",syn:["capacity","availability"],err:"« Bandwidth » au figuré = capacité humaine, pas la bande passante réseau.",mem:"Capacité du tuyau = capacité de la personne.",alts:["disponibilite","disponibilité","capacite","capacité","bande passante","bandwidth"]},
{i:122,en:"In the weeds",fr:"Dans les détails / Submergé par les détails",type:"expression",cat:"Meetings",tags:["expression","meetings","executive","details"],exp:"Too deep in the details, often at the expense of the big picture.",ex:"Let's not get in the weeds on the API spec — we need a yes or no first.",ex2:"The exec doesn't want to be in the weeds, just a clear recommendation.",ipa:"/ɪn ðə wiːdz/",tip:"« in theu WIIDZ ». 'ee' = ii long.",syn:["bogged down","too deep in details"],err:"« In the weeds » ≠ noyé sous le travail (= « slammed »).",mem:"Perdu dans les hautes herbes = perdu dans les détails.",alts:["dans les details","dans les détails","perdu dans les details","submerge par les details","submergé par les détails"]},
{i:123,en:"Run it by",fr:"Soumettre à / Demander l'avis de",type:"phrasal verb",cat:"Meetings",tags:["expression","stakeholders","review"],exp:"To share a draft or idea with someone to get their input before finalizing.",ex:"Let me run it by Legal before we send the redlines back.",ex2:"Run the new pricing by your CFO and let me know what they push back on.",ipa:"/rʌn ɪt baɪ/",tip:"« RUN it bay ». 'u' court.",syn:["check with","loop in for review"],err:"« Run by » + personne, pas + sujet : « run it by Sarah », pas « run it by pricing ».",mem:"Faire passer l'idée DEVANT quelqu'un avant de valider.",alts:["soumettre","demander l'avis","valider avec","faire valider"]},
{i:124,en:"Take it offline",fr:"En parler à part / Hors réunion",type:"expression",cat:"Meetings",tags:["expression","meetings","etiquette"],exp:"To move a side discussion out of the current meeting to keep the agenda on track.",ex:"Great point — let's take it offline so we can finish the agenda.",ex2:"We took the contract details offline and closed them by end of day.",ipa:"/teɪk ɪt ˈɒf.laɪn/",tip:"« teyk it OFF-layn ».",syn:["follow up separately","handle 1:1"],err:"« Offline » ici n'a rien à voir avec internet : c'est « en dehors de cette réunion ».",mem:"Sortir le sujet de la « ligne » de la réunion en cours.",alts:["en parler a part","en parler à part","hors reunion","hors réunion","en discuter separement","en discuter séparément","prendre offline"]},
{i:125,en:"Raise a flag",fr:"Tirer la sonnette d'alarme",type:"expression",cat:"Customer Success",tags:["expression","cs","risk","escalation"],exp:"To alert stakeholders to a risk or problem early.",ex:"I want to raise a flag on the renewal — the champion just left the company.",ex2:"If you see usage drop two weeks in a row, raise a flag with the CSM.",ipa:"/reɪz ə flæɡ/",tip:"« reyz eu FLAG ». 'ai' = ey.",syn:["flag a risk","escalate","alert"],err:"« Raise a red flag » insiste sur l'urgence ; « raise a flag » est plus neutre.",mem:"Lever un drapeau = signaler un risque visible.",alts:["tirer la sonnette d'alarme","alerter","signaler un risque","remonter un risque","flagger"]},
{i:126,en:"Acknowledged",fr:"Reconnu / Pris en compte",type:"adjective",cat:"Expressions",tags:["formal-business","communication","email"],exp:"Recognised, noted or formally received — common in business email replies.",ex:"Your concern is acknowledged and we'll address it in the next review.",ex2:"Receipt of the contract is hereby acknowledged.",ipa:"/əkˈnɒl.ɪdʒd/",tip:"« ak-NO-lidjd ». Le 'k' est muet ; stress sur NO.",syn:["noted","recognised","received"],err:"Pas « aknowledged » : il faut le 'c' silencieux.",mem:"Ack = signal d'accusé de réception.",alts:["reconnu","admis","accuse de reception","accusé de réception","acknowledged","pris en compte"]},
{i:127,en:"Be at ease",fr:"Soyez à l'aise",type:"expression",cat:"Expressions",tags:["formal-business","communication","meetings"],exp:"Polite invitation to relax or feel comfortable in a situation.",ex:"Please be at ease — this is an informal discussion, not an evaluation.",ex2:"Be at ease around senior leaders; they want a peer, not a pitch.",ipa:"/biː ət iːz/",tip:"« bi at IIZ ». 'ea' = ii long.",syn:["feel free","make yourself comfortable"],err:"« At ease » ≠ « easy » : c'est l'état mental, pas la difficulté.",mem:"At + ease = en état détendu.",alts:["soyez a l'aise","soyez à l'aise","detendez-vous","détendez-vous","mettez-vous à l'aise"]},
{i:128,en:"Bear that in mind",fr:"Gardez cela à l'esprit",type:"expression",cat:"Expressions",tags:["formal-business","communication","meetings"],exp:"Used to ask someone to remember a point throughout a decision or discussion.",ex:"We'll cover three options — bear that in mind when you weigh costs.",ex2:"Bear in mind that EMEA pricing must include VAT.",ipa:"/beər ðæt ɪn maɪnd/",tip:"« BÈR thatt in MAYND ». 'ea' = èr.",syn:["keep in mind","remember"],err:"« Bear » (porter, ours) ≠ « bare » (nu). Homophones piégeux.",mem:"Tu portes (bear) cette pensée dans l'esprit.",alts:["garder a l'esprit","garder à l'esprit","gardez cela a l'esprit","gardez cela à l'esprit","n'oubliez pas que"]},
{i:129,en:"Bestow",fr:"Accorder / Conférer",type:"verb",cat:"Expressions",tags:["formal-business","executive","literary"],exp:"To formally grant something — title, honour, privilege — typically by an authority.",ex:"The board bestowed the title of Distinguished Engineer on three principals this year.",ex2:"Trust is bestowed slowly and lost quickly.",ipa:"/bɪˈstoʊ/",tip:"« bi-STOH ». Stress sur STOH.",syn:["grant","confer","award"],err:"« Bestow on/upon someone », pas « bestow to someone ».",mem:"Be + stow (ranger) → placer un honneur sur quelqu'un.",alts:["accorder","conferer","conférer","decerner","décerner","octroyer"]},
{i:130,en:"Boasting",fr:"Se vanter",type:"verb",cat:"Expressions",tags:["formal-business","communication","behavior"],exp:"Talking with excessive pride about one's achievements — often viewed negatively.",ex:"There's a fine line between confidence and boasting in a sales call.",ex2:"Without boasting, our retention is the best in the segment.",ipa:"/ˈboʊ.stɪŋ/",tip:"« BOH-sting ». 'oa' = oh long.",syn:["bragging","showing off"],err:"« To boast about » (verbe d'action), pas « to boast on ».",mem:"Boast = bombe la poitrine.",alts:["se vanter","fanfaronner","s'enorgueillir","frimer"]},
{i:131,en:"Convey",fr:"Transmettre / Faire passer",type:"verb",cat:"Expressions",tags:["formal-business","communication","executive"],exp:"To communicate an idea, message or feeling — often more formal than 'tell'.",ex:"Please convey our thanks to the security team for the fast response.",ex2:"The slide doesn't convey the urgency we want the board to feel.",ipa:"/kənˈveɪ/",tip:"« keun-VEY ». Stress sur VEY.",syn:["communicate","express","relay"],err:"« Convey » s'applique à un message, pas à un objet physique (sauf transport).",mem:"Comme un tapis roulant (conveyor) : tu fais passer l'idée.",alts:["transmettre","faire passer","vehiculer","véhiculer","communiquer"]},
{i:132,en:"Covet",fr:"Convoiter",type:"verb",cat:"Expressions",tags:["formal-business","executive","literary"],exp:"To desire something strongly, especially something belonging to someone else.",ex:"Every account executive on the team covets the Global 2000 patch.",ex2:"The CMO role is one of the most coveted positions in the company.",ipa:"/ˈkʌv.ɪt/",tip:"« KO-vitt ». 'o' court comme dans 'cup'.",syn:["desire","crave","yearn for"],err:"Le passé est « coveted », pas « coved ».",mem:"Pensé à 'covid'… non, 'co-VIT' — tu en veux à tout prix.",alts:["convoiter","desirer ardemment","désirer ardemment","lorgner sur"]},
{i:133,en:"Entertain an idea",fr:"Envisager une idée",type:"expression",cat:"Expressions",tags:["formal-business","executive","strategy"],exp:"To consider a possibility seriously, without yet committing.",ex:"Would you entertain the idea of a multi-year deal with quarterly check-ins?",ex2:"The CTO won't even entertain a private-cloud migration this year.",ipa:"/ˌen.tərˈteɪn ən aɪˈdɪə/",tip:"« en-teur-TEYN eun ay-DIA ». Liaison fluide.",syn:["consider","weigh","contemplate"],err:"Ici « entertain » ≠ divertir. C'est ouvrir l'esprit à une idée.",mem:"Recevoir (entertain) une idée comme un invité.",alts:["envisager","considerer","considérer","examiner l'idee","examiner l'idée"]},
{i:134,en:"Even",fr:"Même",type:"adverb",cat:"Expressions",tags:["formal-business","grammar","communication"],exp:"Used to emphasise something surprising or unexpected.",ex:"Even our most senior reps struggle with enterprise procurement timelines.",ex2:"The model performs well, even on noisy production data.",ipa:"/ˈiː.vən/",tip:"« II-veun ». 'e' = ii long.",syn:["still","yet","also"],err:"« Even » avant le verbe principal : « we even tested it », pas « we tested it even ».",mem:"Mettre l'accent sur quelque chose d'inattendu.",alts:["meme","même","y compris"]},
{i:135,en:"Even though",fr:"Même si / Bien que",type:"expression",cat:"Expressions",tags:["formal-business","grammar","writing"],exp:"Used to introduce a fact that contrasts with the main clause.",ex:"Even though pipeline is healthy, win rates have dropped.",ex2:"We shipped on time even though two engineers were out sick.",ipa:"/ˈiː.vən ðoʊ/",tip:"« II-veun thô ». 'th' doux comme dans 'this'.",syn:["although","though","despite the fact that"],err:"« Even though » + fait réel ; « even if » + hypothèse.",mem:"Même + bien que → contraste renforcé.",alts:["meme si","même si","bien que","quoique"]},
{i:136,en:"Even I",fr:"Même moi",type:"expression",cat:"Expressions",tags:["formal-business","grammar","communication"],exp:"Used to stress that something is true for a particularly unlikely person — including the speaker.",ex:"Even I struggle to remember every clause of the new MSA.",ex2:"Even I, after ten years in the space, was surprised by their pricing model.",ipa:"/ˈiː.vən aɪ/",tip:"« II-veun AY ». Bien marquer le AY.",syn:["myself included","including me"],err:"« Even me » à l'oral est courant mais moins formel que « even I ».",mem:"Même la personne qui parle est concernée.",alts:["meme moi","même moi"]},
{i:137,en:"Feat",fr:"Exploit / Prouesse",type:"noun",cat:"Expressions",tags:["formal-business","achievement","executive"],exp:"An impressive achievement, often requiring skill, courage, or effort.",ex:"Shipping that platform in six months was no small feat.",ex2:"It's a remarkable feat of engineering — three nines of uptime from day one.",ipa:"/fiːt/",tip:"« FIIT ». 'ea' = ii long ; ne dites pas 'feet'.",syn:["achievement","accomplishment","triumph"],err:"« Feat » (exploit) ≠ « feet » (pieds) malgré la prononciation similaire.",mem:"Un feat = un exploit dont on parle.",alts:["exploit","prouesse","accomplissement","tour de force"]},
{i:138,en:"Filthy",fr:"Sale / Crasseux",type:"adjective",cat:"Expressions",tags:["formal-business","literary","behavior"],exp:"Extremely dirty — also used figuratively for unethical behaviour or huge sums.",ex:"That practice is filthy — the regulator would have a field day.",ex2:"He made filthy money on that exit and retired at 38.",ipa:"/ˈfɪl.θi/",tip:"« FIL-thi ». 'th' sourd comme dans 'think'.",syn:["dirty","disgusting","grimy"],err:"« Filthy rich » est une expression figée signifiant 'immensément riche'.",mem:"Filth = saleté → filthy = sale.",alts:["sale","crasseux","degoutant","dégoûtant","immonde"]},
{i:139,en:"Furthermore",fr:"De plus / Par ailleurs",type:"adverb",cat:"Expressions",tags:["formal-business","writing","executive"],exp:"Used to add another formal point to an argument, typically in writing.",ex:"Furthermore, the new pricing aligns us with the top three competitors.",ex2:"The platform is faster; furthermore, it costs 30% less to operate.",ipa:"/ˈfɜːr.ðər.mɔːr/",tip:"« FEUR-theur-mor ». Stress sur la première syllabe.",syn:["moreover","in addition","besides"],err:"À éviter à l'oral informel — préférez « and » ou « also ».",mem:"Va plus loin (further) + en plus (more).",alts:["de plus","par ailleurs","en outre","de surcroit","de surcroît","qui plus est"]},
{i:140,en:"Moreover",fr:"De plus / Qui plus est",type:"adverb",cat:"Expressions",tags:["formal-business","writing","executive"],exp:"Used in formal writing to add a related and reinforcing point.",ex:"The integration cut onboarding time in half; moreover, support tickets dropped 40%.",ex2:"Moreover, the new region opens up significant public-sector pipeline.",ipa:"/mɔːrˈoʊ.vər/",tip:"« mor-OH-veur ». Stress sur OH.",syn:["furthermore","in addition","what's more"],err:"Toujours suivi d'une virgule en début de phrase.",mem:"More + over = quelque chose en plus, par-dessus.",alts:["de plus","qui plus est","en outre","par ailleurs"]},
{i:141,en:"Getting along with",fr:"S'entendre avec",type:"expression",cat:"Expressions",tags:["formal-business","behavior","communication"],exp:"To have a good and cooperative relationship with someone.",ex:"She's known for getting along with even the toughest procurement teams.",ex2:"Getting along with engineering is half the AE's job in technical sales.",ipa:"/ˈɡet.ɪŋ əˈlɒŋ wɪð/",tip:"« GUE-ting eu-LONG with ». Liaison fluide.",syn:["working well with","building rapport with"],err:"« Get along with » + personne, pas + tâche.",mem:"Avancer ensemble (along) sans friction.",alts:["s'entendre avec","bien s'entendre","cooperer avec","coopérer avec"]},
{i:142,en:"Harm",fr:"Nuire / Faire du tort",type:"verb",cat:"Expressions",tags:["formal-business","risk","executive"],exp:"To cause damage — physical, reputational, or commercial.",ex:"A public outage would harm the brand far more than a delayed launch.",ex2:"This clause could harm us in any future acquisition discussion.",ipa:"/hɑːrm/",tip:"« HARRM ». 'h' bien expiré, 'r' roulé léger.",syn:["damage","hurt","injure"],err:"« Harm » + objet direct ; pas « harm to someone » sauf en formule (« cause harm to »).",mem:"Harm = tort, à éviter à tout prix.",alts:["nuire","faire du tort","porter prejudice","porter préjudice","leser","léser"]},
{i:143,en:"It causes harm",fr:"Ça cause du tort",type:"expression",cat:"Expressions",tags:["formal-business","risk","communication"],exp:"Used to flag that a decision or behaviour produces real negative impact.",ex:"Skipping the security review feels efficient but it causes harm downstream.",ex2:"It causes harm to morale when feedback never reaches the team.",ipa:"/ɪt ˈkɔː.zɪz hɑːrm/",tip:"« itt KOZIZ harm ».",syn:["it's damaging","it has a negative impact"],err:"« Cause harm to + someone/something », jamais « cause harm of ».",mem:"Ça crée du tort, pas juste de la gêne.",alts:["ca cause du tort","ça cause du tort","ca fait du mal","ça fait du mal","c'est nuisible"]},
{i:144,en:"However",fr:"Cependant / Toutefois",type:"adverb",cat:"Expressions",tags:["formal-business","writing","executive"],exp:"Used to introduce a contrasting statement in a formal tone.",ex:"The pilot succeeded; however, the rollout will require additional headcount.",ex2:"However tempting the discount, it would break our floor pricing policy.",ipa:"/haʊˈev.ər/",tip:"« haou-EV-eur ». Stress sur EV.",syn:["nevertheless","nonetheless","still"],err:"« However » en milieu de phrase prend une virgule de chaque côté.",mem:"Un 'mais' poli et formel.",alts:["cependant","toutefois","neanmoins","néanmoins","pourtant"]},
{i:145,en:"I can't fathom",fr:"Je n'arrive pas à comprendre",type:"expression",cat:"Expressions",tags:["formal-business","communication","executive"],exp:"To be unable to grasp or make sense of something, often surprising or absurd.",ex:"I can't fathom why they'd walk away from a deal this aligned.",ex2:"It's hard to fathom the scale until you see the production traffic.",ipa:"/aɪ kɑːnt ˈfæð.əm/",tip:"« ay kant FA-them ». 'th' doux.",syn:["I can't grasp","I can't understand"],err:"« Fathom » sans 'don't' = saisir. Avec 'can't' = ne pas saisir.",mem:"Fathom = unité de profondeur → mesurer la profondeur d'une idée.",alts:["je n'arrive pas a comprendre","je n'arrive pas à comprendre","ca me depasse","ça me dépasse","incomprehensible","incompréhensible"]},
{i:146,en:"Look further",fr:"Regarder plus loin",type:"expression",cat:"Expressions",tags:["formal-business","strategy","executive"],exp:"To investigate or consider beyond the surface or current scope.",ex:"Look further than this quarter — what does the segment look like in 18 months?",ex2:"If you want talent like that, you won't have to look further than this team.",ipa:"/lʊk ˈfɜːr.ðər/",tip:"« louk FEUR-theur ».",syn:["look beyond","dig deeper"],err:"« Further » pour la métaphore ; « farther » pour la distance physique.",mem:"Regarder au-delà de ce qui est évident.",alts:["regarder plus loin","aller plus loin","creuser","approfondir"]},
{i:147,en:"My grasp",fr:"Ma compréhension / Ma portée",type:"noun",cat:"Expressions",tags:["formal-business","executive","communication"],exp:"The extent of one's understanding or reach.",ex:"That kind of advanced ML architecture is outside my grasp — let's get a SE on the call.",ex2:"The fundamentals are now within my grasp after three months of ramp.",ipa:"/maɪ ɡræsp/",tip:"« may GRASP ». 'a' court.",syn:["my understanding","my reach"],err:"« Grasp » s'utilise au singulier dans cette expression.",mem:"Grasp = saisir → la portée de ta compréhension.",alts:["ma comprehension","ma compréhension","ma portee","ma portée","ma maitrise","ma maîtrise"]},
{i:148,en:"Out of my grasp",fr:"Hors de ma portée",type:"expression",cat:"Expressions",tags:["formal-business","executive","communication"],exp:"Beyond what one can understand, achieve, or control.",ex:"The CTO meeting was out of my grasp this week — we'll loop in the RVP.",ex2:"That promotion is still out of my grasp without two more enterprise wins.",ipa:"/aʊt əv maɪ ɡræsp/",tip:"« aout ov may GRASP ».",syn:["beyond me","out of reach"],err:"Reconnaître ce qui est out of grasp est un signe de maturité, pas de faiblesse.",mem:"Trop loin pour être attrapé.",alts:["hors de ma portee","hors de ma portée","au-dela de ma portee","au-delà de ma portée","inaccessible"]},
{i:149,en:"On that",fr:"À ce sujet",type:"expression",cat:"Expressions",tags:["formal-business","meetings","communication"],exp:"Used to transition to a specific topic just mentioned.",ex:"On that, let me share what Procurement sent over last night.",ex2:"Quick build on that — we saw a similar pattern in EMEA.",ipa:"/ɒn ðæt/",tip:"« on THATT ». 'th' doux.",syn:["on that note","speaking of which"],err:"« On that note » = transition complète ; « on that » = enchaînement court.",mem:"Reprendre la balle sur le sujet venant d'être lancé.",alts:["a ce sujet","à ce sujet","la-dessus","là-dessus","sur ce point"]},
{i:150,en:"Onto",fr:"Vers / Sur",type:"preposition",cat:"Expressions",tags:["formal-business","grammar","communication"],exp:"Indicates movement towards a position on top of something, or transition to a new topic.",ex:"Let's move onto the next quarter's targets.",ex2:"She quickly latched onto the strategic implications of the new pricing.",ipa:"/ˈɒn.tuː/",tip:"« ON-tou ». Stress sur ON.",syn:["on to","towards"],err:"« Onto » (mouvement) ≠ « on to » (deux mots, autre construction).",mem:"On + to → vers et dessus.",alts:["sur","vers","par-dessus","jusqu'à","onto"]},
{i:151,en:"Otherwise",fr:"Sinon / Autrement",type:"adverb",cat:"Expressions",tags:["formal-business","writing","executive"],exp:"In a different way, or as a consequence of something not happening.",ex:"We need exec buy-in by Friday — otherwise the launch slips.",ex2:"The deal is solid; otherwise, the forecast would be off by 200K.",ipa:"/ˈʌð.ər.waɪz/",tip:"« UTH-eur-wayz ». 'th' doux.",syn:["if not","or else","else"],err:"« Otherwise » au début d'une phrase prend toujours une virgule.",mem:"Other + wise → d'une autre manière.",alts:["sinon","autrement","faute de quoi","sans quoi"]},
{i:152,en:"Recklessly",fr:"Imprudemment",type:"adverb",cat:"Expressions",tags:["formal-business","risk","behavior"],exp:"In a careless way, without regard for risk or consequence.",ex:"They scaled the team recklessly and now half the desks are empty.",ex2:"Don't discount recklessly — it sets a precedent for the next renewal.",ipa:"/ˈrek.ləs.li/",tip:"« REK-leuss-li ». Stress sur REK.",syn:["carelessly","rashly","irresponsibly"],err:"« Reckless » (adj) ≠ « wreckless » (n'existe pas).",mem:"Reck (souci) + less → sans souci du risque.",alts:["imprudemment","temerairement","témérairement","inconsequence","inconséquemment"]},
{i:153,en:"Regardless",fr:"Quoi qu'il en soit / Malgré tout",type:"adverb",cat:"Expressions",tags:["formal-business","executive","communication"],exp:"Without considering the situation or in spite of it.",ex:"Regardless of the cost, we need to protect the brand here.",ex2:"The team shipped on time regardless of two unexpected outages.",ipa:"/rɪˈɡɑːrd.ləs/",tip:"« ri-GARD-leuss ». Stress sur GARD.",syn:["nevertheless","anyway","in any case"],err:"« Irregardless » n'existe pas en anglais standard — utilisez « regardless ».",mem:"Sans (less) considération (regard) du contexte.",alts:["quoi qu'il en soit","malgre tout","malgré tout","peu importe","quoi qu'il arrive"]},
{i:154,en:"Relief",fr:"Soulagement",type:"noun",cat:"Expressions",tags:["formal-business","communication","executive"],exp:"A feeling of reassurance after pressure, worry or pain.",ex:"It was a real relief to see the renewal come in last night.",ex2:"The new tooling will be a relief to the support team — current ticket volume is unsustainable.",ipa:"/rɪˈliːf/",tip:"« ri-LIIF ». 'ie' = ii long.",syn:["reassurance","ease","comfort"],err:"« Relief » (nom) ≠ « relieve » (verbe).",mem:"Re + lief (léger) → on se sent plus léger.",alts:["soulagement","apaisement","reconfort","réconfort"]},
{i:155,en:"Restless",fr:"Agité / Impatient",type:"adjective",cat:"Expressions",tags:["formal-business","behavior","executive"],exp:"Unable to relax or stay still, often due to anxiety or impatience.",ex:"The board is getting restless about the EMEA hiring plan.",ex2:"Customers grow restless when status updates slip more than once.",ipa:"/ˈrest.ləs/",tip:"« REST-leuss ». Stress sur REST.",syn:["uneasy","fidgety","impatient"],err:"« Restless » ne signifie pas « fatigué » — c'est l'opposé du repos calme.",mem:"Sans (less) repos (rest) → agité.",alts:["agite","agité","impatient","nerveux","inquiet"]},
{i:156,en:"Scornful",fr:"Méprisant",type:"adjective",cat:"Expressions",tags:["formal-business","behavior","communication"],exp:"Showing strong contempt or disrespect toward someone or something.",ex:"His tone became scornful the moment we mentioned a competitor's solution.",ex2:"Avoid scornful language in objection handling — it always backfires.",ipa:"/ˈskɔːrn.fəl/",tip:"« SKORN-feul ». Stress sur SKORN.",syn:["contemptuous","disdainful","derisive"],err:"À éviter dans toute communication client — détruit la confiance.",mem:"Scorn = mépris → scornful = qui méprise.",alts:["meprisant","méprisant","dedaigneux","dédaigneux","condescendant"]},

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
const LS_KEY = "bep_state_v1";
const defaultState = () => ({
  xp:0, level:1, streak:0, lastDay:null,
  totals:{correct:0,wrong:0,sessions:0},
  // spaced repetition: per term { box:1..5, due:timestamp, wrong:0, right:0 }
  srs:{},
  weak:{},
  prefs:{mode:"flash",cat:"All",rate:0.95,accent:"en-US",voiceURI:""}
});
let S = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    return Object.assign(base, parsed, {
      totals:Object.assign(base.totals, parsed.totals || {}),
      prefs:Object.assign(base.prefs, parsed.prefs || {})
    });
  }catch(e){ return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* Daily streak update */
(function tickStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(S.lastDay !== today){
    if(S.lastDay){
      const a = new Date(S.lastDay), b = new Date(today);
      const diff = Math.round((b-a)/86400000);
      if(diff === 1) S.streak += 1;
      else if(diff > 1) S.streak = 1;
    } else S.streak = 1;
    S.lastDay = today;
    saveState();
  }
})();

   HELPERS
   ============================================================ */
function $(sel,root=document){return root.querySelector(sel)}
function $$(sel,root=document){return [...root.querySelectorAll(sel)]}
function normalize(s){
  return (s||"").toString().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[''`´]/g,"'")
    .replace(/[—–]/g,"-")
    .replace(/[.,!?;:]/g,"")
    .replace(/\s+/g," ").trim();
}
function escHtml(s){
  return (s==null?"":String(s)).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
}
function shuffle(arr){
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function highlight(text, term){
  if(!text || !term) return text;
  try{
    const escaped = term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return text.replace(new RegExp(`(${escaped})`,"gi"), "<b>$1</b>");
  }catch(e){ return text; }
}
function levelFromXp(xp){ return 1 + Math.floor(Math.sqrt(xp/40)); }
function nextLevelXp(lvl){ return Math.pow(lvl,2)*40; }

/* ===== Audio (Web Speech API) ===== */
let voices = [];
let speechPrimed = false;
function loadVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  return voices;
}
function primeSpeech(){
  if(speechPrimed || !("speechSynthesis" in window)) return;
  try {
    const u = new SpeechSynthesisUtterance("");
    u.volume = 0;
    window.speechSynthesis.speak(u);
    speechPrimed = true;
  } catch(e){}
}
if("speechSynthesis" in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); if($("#voice-select")) render(); };
  // Prime the speech engine on the first user gesture (required on iOS Safari).
  const primer = ()=>{ primeSpeech(); document.removeEventListener("click", primer, true); document.removeEventListener("touchstart", primer, true); };
  document.addEventListener("click", primer, {capture:true});
  document.addEventListener("touchstart", primer, {capture:true, passive:true});
  // Some browsers (esp. iOS) pause synthesis after ~15s idle; periodically resume.
  setInterval(()=>{
    try {
      if(window.speechSynthesis.paused) window.speechSynthesis.resume();
    } catch(e){}
  }, 4000);
}
function currentAccent(){ return S.prefs.accent === "en-GB" ? "en-GB" : "en-US"; }
function accentInfo(id=currentAccent()){ return ACCENTS.find(a=>a.id===id) || ACCENTS[0]; }
function voiceLang(v){ return (v.lang || "").replace("_","-"); }
function isEnglishVoice(v){ return /^en(-|$)/i.test(voiceLang(v)); }
function voiceLabel(v){ return `${v.name} (${voiceLang(v) || "English"})`; }
function scoreVoice(v, accentId){
  const accent = accentInfo(accentId);
  const lang = voiceLang(v);
  const name = v.name || "";
  let score = 0;
  if(new RegExp(`^${accent.id}$`,"i").test(lang)) score += 100;
  if(new RegExp(`^${accent.id.split("-")[0]}`,"i").test(lang)) score += 20;
  if(accent.names.some(rx=>rx.test(name))) score += 80;
  if(/Natural|Online|Premium|Enhanced/i.test(name)) score += 45;
  if(/Google|Microsoft|Apple/i.test(name)) score += 25;
  if(/Zira|David|Hazel|Susan/i.test(name)) score -= 20;
  if(v.localService) score += 5;
  return score;
}
function englishVoices(){
  return loadVoices()
    .filter(isEnglishVoice)
    .map(v=>({v,score:scoreVoice(v,currentAccent())}))
    .sort((a,b)=>b.score-a.score || voiceLabel(a.v).localeCompare(voiceLabel(b.v)))
    .map(x=>x.v);
}
function pickVoice(accentId=currentAccent()){
  const available = loadVoices().filter(isEnglishVoice);
  if(!available.length) return null;
  if(S.prefs.voiceURI){
    const chosen = available.find(v=>v.voiceURI === S.prefs.voiceURI);
    if(chosen) return chosen;
  }
  return available
    .map(v=>({v,score:scoreVoice(v,accentId)}))
    .sort((a,b)=>b.score-a.score)[0].v;
}
function setAccent(accentId){
  if(!ACCENTS.some(a=>a.id===accentId)) return;
  S.prefs.accent = accentId;
  S.prefs.voiceURI = "";
  saveState();
  toast(`Accent audio : ${accentInfo().label}`, "ok");
  render();
}
function setVoice(voiceURI){
  S.prefs.voiceURI = voiceURI || "";
  const v = englishVoices().find(x=>x.voiceURI === S.prefs.voiceURI);
  if(v && /^en-GB/i.test(voiceLang(v))) S.prefs.accent = "en-GB";
  if(v && /^en-US/i.test(voiceLang(v))) S.prefs.accent = "en-US";
  saveState();
  toast(v ? `Voix audio : ${v.name}` : "Voix audio : automatique", "ok");
  render();
}
function accentButtons(inline=false){
  return ACCENTS.map(a=>`<button class="f-btn accent ${currentAccent()===a.id?'active':''}" ${inline?`onclick="setAccent('${a.id}')"`:`data-accent="${a.id}"`} title="${a.label} English">${a.short}</button>`).join("");
}
function voiceSelect(){
  const list = englishVoices();
  if(!list.length) return `<p class="hint" style="margin-top:10px">Aucune voix anglaise détectée dans ce navigateur.</p>`;
  const options = list.map(v=>`<option value="${escHtml(v.voiceURI)}" ${S.prefs.voiceURI===v.voiceURI?'selected':''}>${escHtml(voiceLabel(v))}</option>`).join("");
  return `<select id="voice-select" class="voice-select" onchange="setVoice(this.value)" aria-label="Choisir une voix anglaise"><option value="">Auto · meilleure voix ${accentInfo().short}</option>${options}</select>`;
}
function speak(text, rate=null, btn=null){
  if(!("speechSynthesis" in window)){ toast("Audio non supporté par ce navigateur","ko"); return; }
  if(!text){ return; }
  primeSpeech();
  const ss = window.speechSynthesis;
  // Resume if the engine got paused silently (iOS / long idle).
  try { ss.resume(); } catch(e){}
  // Cancel any queued/in-flight utterance. On Chrome/Safari, calling speak()
  // immediately after cancel() can race; wait a tick.
  ss.cancel();
  const accent = currentAccent();
  const v = pickVoice(accent);
  if(!v && voices.length){
    toast("Aucune voix anglaise trouvée. Installez une voix English US/UK sur l'appareil.", "ko");
    return;
  }
  if(btn){ btn.classList.add("speaking"); }
  const launch = ()=>{
    const utt = new SpeechSynthesisUtterance(text);
    if(v){ utt.voice = v; utt.lang = voiceLang(v) || accent; }
    else { utt.lang = accent; }
    utt.rate = rate || S.prefs.rate || 0.95;
    utt.pitch = 1;
    utt.onend = utt.onerror = ()=>{ if(btn) btn.classList.remove("speaking"); };
    try { ss.speak(utt); } catch(e){ if(btn) btn.classList.remove("speaking"); }
    // iOS sometimes drops the first utterance after a cancel; double-check.
    setTimeout(()=>{
      if(!ss.speaking && !ss.pending){
        try { ss.speak(utt); } catch(e){}
      }
    }, 220);
  };
  setTimeout(launch, 60);
}

/* ===== Toast ===== */
let toastTimer;
function toast(msg, kind=""){
  const t = $("#toast"); t.textContent = msg; t.className = "toast show " + kind;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.className = "toast " + kind; }, 2200);
}

/* ===== XP / scoring ===== */
function addXp(n, term){
  S.xp += n;
  const nl = levelFromXp(S.xp);
  if(nl > S.level){ S.level = nl; toast(`🎉 Level up! You are now level ${nl}`,"xp"); }
  saveState();
  refreshHud();
}
function refreshHud(){
  $("#hud-xp").textContent = S.xp;
  $("#hud-lvl").textContent = S.level;
  $("#hud-streak").textContent = S.streak;
}

/* ===== SRS (Leitner 5 boxes) ===== */
const BOX_INTERVALS_H = [0, 4, 24, 72, 168, 336]; // 1->4h, 2->1d, 3->3d, 4->7d, 5->14d
function srsRecord(id, ok){
  const now = Date.now();
  const r = S.srs[id] || {box:1,due:now,wrong:0,right:0};
  if(ok){ r.right++; r.box = Math.min(5, r.box+1); }
  else { r.wrong++; r.box = 1; S.weak[id] = (S.weak[id]||0)+1; }
  r.due = now + BOX_INTERVALS_H[r.box]*3600*1000;
  S.srs[id] = r;
  saveState();
}

/* ============================================================
   GAME ENGINE
   ============================================================ */
const G = {
  mode:"flash", cat:"All",
  deck:[], i:0, status:"idle", session:{correct:0,wrong:0},
  flipped:false, lastAnswer:""
};

function buildDeck(){
  let d = VOCAB.slice();
  if(G.cat !== "All") d = d.filter(v=>v.cat === G.cat);
  // SRS priority: items due first, then newest
  d.sort((a,b)=>{
    const ra = S.srs[a.i]?.due ?? 0, rb = S.srs[b.i]?.due ?? 0;
    return ra - rb;
  });
  d = shuffle(d).slice(0, 20); // session of 20
  G.deck = d; G.i = 0; G.status = "idle"; G.session = {correct:0,wrong:0}; G.flipped = false;
  S.prefs.mode = G.mode; S.prefs.cat = G.cat; saveState();
  render();
}

function render(){
  if(!G.deck.length){
    $("#main").innerHTML = `
      <div class="welcome">
        <h1>Master <span>Business English</span> for SaaS, Cloud & AI.</h1>
        <p>125 termes natifs, audio, 5 modes de jeu, répétition espacée, et export Anki. Conçu pour les francophones visant un poste CSM, AE ou Sales en SaaS/AI/Cloud.</p>
        <div class="actions">
          <button class="btn primary" onclick="startSession()">Commencer · 20 cartes</button>
          <button class="btn" onclick="openExport()">Exporter Anki / CSV / JSON</button>
        </div>
      </div>`;
    return;
  }
  renderTabs();
  renderFilters();
  renderProgress();
  renderStage();
  refreshHud();
}

function renderTabs(){
  const html = MODES.map(m=>`<button class="mode-btn ${m.id===G.mode?'active':''}" data-mode="${m.id}">${m.icon} ${m.label}</button>`).join("");
  let bar = $("#mode-bar");
  if(!bar){
    bar = document.createElement("div"); bar.id = "mode-bar"; bar.className = "modes";
    $("#main").innerHTML = "";
    $("#main").appendChild(bar);
  }
  bar.innerHTML = html;
  bar.onclick = e => {
    const b = e.target.closest("[data-mode]"); if(!b) return;
    G.mode = b.dataset.mode; buildDeck();
  };
}

function renderFilters(){
  let row = $("#filters-row");
  if(!row){
    row = document.createElement("div"); row.id = "filters-row"; row.className = "filters";
    $("#main").appendChild(row);
  }
  row.innerHTML = `
    <span class="filter-label">Theme</span>
    <div class="filter-group">${CATEGORIES.map(c=>`<button class="f-btn ${c===G.cat?'active':''}" data-cat="${c}">${c}</button>`).join("")}</div>
    <span class="filter-label" style="margin-left:8px">Accent</span>
    <div class="filter-group">${accentButtons(false)}</div>`;
  row.onclick = e => {
    const c = e.target.closest("[data-cat]");
    const a = e.target.closest("[data-accent]");
    if(c){ G.cat = c.dataset.cat; buildDeck(); }
    if(a){ setAccent(a.dataset.accent); }
  };
}

function renderProgress(){
  let p = $("#progress"); 
  if(!p){
    p = document.createElement("div"); p.id="progress"; p.className="progress"; p.innerHTML='<div></div>';
    $("#main").appendChild(p);
  }
  const pct = G.deck.length ? Math.round(G.i / G.deck.length * 100) : 0;
  p.querySelector("div").style.width = pct + "%";
}

function renderStage(){
  let stage = $("#stage");
  if(!stage){
    stage = document.createElement("div"); stage.id="stage"; stage.className="stage";
    $("#main").appendChild(stage);
  }
  if(G.i >= G.deck.length){ renderComplete(stage); return; }
  const card = G.deck[G.i];
  switch(G.mode){
    case "flash": renderFlash(stage, card); break;
    case "listen": renderListening(stage, card); break;
    default: renderFlash(stage, card);
  }
}

function cardHeader(card){
  return `
    <div class="head">
      <div class="tagrow">
        <span class="tag">${card.cat}</span>
        <span class="tag type">${card.type}</span>
      </div>

    </div>`;
}
function audioBtns(text){
  const accent = accentInfo();
  return `
    <div class="audio-row">
      <button class="audio-btn" onclick="speak(${JSON.stringify(text)},0.95,this)" title="${accent.label} English · normal">🔊 ${accent.short} Normal</button>
      <button class="audio-btn slow" onclick="speak(${JSON.stringify(text)},0.6,this)" title="${accent.label} English · slow">🐢 ${accent.short} Slow</button>

}
function metaPanels(card){
  return `

/* ----- FLASH MODE ----- */
function renderFlash(stage, card){
  if(!G.flipped){
    stage.innerHTML = `
      <div class="card flash-card">
        ${cardHeader(card)}
        <div>
          <div class="side-label">Recto · anglais</div>
          <div class="term-row"><span class="term">${card.en}</span></div>

          <div class="example" style="margin-top:18px">"${highlight(card.ex, card.en)}"</div>
        </div>
        <div class="flash-actions">
          <button class="btn primary" onclick="flipCard(event)">Voir la réponse</button>
        </div>
        <p class="hint desktop-only"><span class="kbd">Space</span> réponse · <span class="kbd">P</span> audio</p>
      </div>`;
    return;
  }
  stage.innerHTML = `
    <div class="card flash-card">
      ${cardHeader(card)}
      <div>
        <div class="side-label">Verso · traduction</div>
        <div class="fr-prompt" style="margin-top:8px">${card.fr}</div>
        <div style="margin-top:14px">${audioBtns(card.en)}</div>
        <div class="example" style="margin-top:18px">"${highlight(card.ex, card.en)}"</div>
        <div class="example" style="margin-top:8px">"${highlight(card.ex2, card.en)}"</div>
        ${metaPanels(card)}
      </div>
      <div class="flash-actions">
        <button class="btn" onclick="answerFlash(false)">À revoir</button>
        <button class="btn ghost" onclick="flipCard(event)">Revoir le recto</button>
        <button class="btn primary" onclick="answerFlash(true)">Je savais · +10 XP</button>
      </div>
      <p class="hint desktop-only"><span class="kbd">←</span>/<span class="kbd">→</span> navigation · <span class="kbd">P</span> audio</p>

}
function flipCard(e){
  if(e && e.target.closest(".audio-btn")) return;
  G.flipped = !G.flipped;
  render();
}
function answerFlash(ok){
  const card = G.deck[G.i];
  srsRecord(card.i, ok);
  if(ok){ G.session.correct++; addXp(10, card.en); }
  else  { G.session.wrong++; addXp(2, card.en); }
  G.flipped = false; nextCard();
}

/* ----- LISTENING MODE ----- */
function renderListening(stage, card){
  let inputClass = "tinput";
  if(G.status === "ok") inputClass += " ok";
  if(G.status === "ko") inputClass += " ko";
  let fb = "";
  if(G.status !== "idle"){
    fb = G.status === "ok"
      ? `<div class="feedback ok"><span class="ico">✓</span><div><span class="lab">Correct!</span><strong>${card.en}</strong> · ${card.ipa}</div></div>`
      : `<div class="feedback ko"><span class="ico">✗</span><div><span class="lab">${G.status==='rev'?'Révélé':'Incorrect'}</span><strong>${card.en}</strong> · ${card.ipa}<br><span style="opacity:.7">Votre réponse : « ${G.lastAnswer||''} »</span></div></div>`;
  }
  stage.innerHTML = `
    <div class="card ${G.status==='ok'?'ok':''}${G.status==='ko'||G.status==='rev'?'ko':''}">
      ${cardHeader(card)}
      <div style="text-align:center;padding:30px 0">

        <div style="display:flex;gap:6px;justify-content:center;margin-top:12px;align-items:center;flex-wrap:wrap">
          <span class="filter-label" style="margin-right:2px">Accent</span>
          ${accentButtons(true)}
        </div>
        <div style="display:grid;gap:8px;justify-items:center;margin-top:12px">
          ${voiceSelect()}
          <button class="btn ghost" onclick="speak('Pipeline, renewal, customer success, annual recurring revenue.',0.92,this)">Tester la voix</button>
        </div>
        <div style="display:inline-flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center">
          <button class="btn primary" onclick="speak(${JSON.stringify(card.en)},0.95,this)">▶ ${accentInfo().short} Normal</button>
          <button class="btn" onclick="speak(${JSON.stringify(card.en)},0.55,this)">🐢 ${accentInfo().short} Slow</button>
        </div>
      </div>
      <div class="input-row">
        <input id="ans" class="${inputClass}" placeholder="Type the English term…" autocomplete="off" autocorrect="off" spellcheck="false" ${G.status!=="idle"?"disabled":""}>
        ${G.status==="idle"
          ? `<button class="btn ghost" onclick="revealListen()">Reveal</button><button class="btn primary" onclick="checkListen()">Check ⏎</button>`
          : `<button class="btn primary" onclick="nextCard()">${G.i>=G.deck.length-1?'Result':'Next →'}</button>`}
      </div>
      ${fb}
      ${G.status!=="idle"?`<div class="example">"${highlight(card.ex, card.en)}"</div>${metaPanels(card)}`:""}
    </div>`;
  if(G.status==="idle"){
    const inp = $("#ans"); if(inp){
      inp.focus();
      inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){e.preventDefault(); checkListen();} });
      // auto-play once
      setTimeout(()=>speak(card.en,0.95), 250);
    }
  }
}
function checkListen(){
  const inp = $("#ans"); if(!inp) return;
  const userVal = normalize(inp.value); if(!userVal) return;
  G.lastAnswer = inp.value;
  const card = G.deck[G.i];
  const ok = normalize(card.en) === userVal;
  G.status = ok ? "ok" : "ko";
  if(ok){ G.session.correct++; addXp(15, card.en); srsRecord(card.i, true); }
  else  { G.session.wrong++; addXp(2, card.en); srsRecord(card.i, false); }
  render();
}
function revealListen(){ G.status = "rev"; G.session.wrong++; srsRecord(G.deck[G.i].i, false); render(); }

/* ----- COMPLETE ----- */
function renderComplete(stage){
  const total = G.session.correct + G.session.wrong;
  const pct = total ? Math.round(G.session.correct/total*100) : 0;
  const cls = pct>=80?'score-green':pct>=60?'score-amber':'score-red';
  S.totals.correct += G.session.correct;
  S.totals.wrong += G.session.wrong;
  S.totals.sessions++;
  saveState();
  stage.innerHTML = `
    <div class="complete">
      <p style="color:var(--muted);font-size:13px">Session complete · ${total} cartes</p>
      <div class="big">${pct}%</div>
      <h2>${pct>=80?'🎯 Excellent':pct>=60?'📈 Bon progrès':'💪 On continue'}</h2>
      <p>✓ ${G.session.correct} correct · ✗ ${G.session.wrong} wrong · +${G.session.correct*15+G.session.wrong*2} XP gagné</p>
      <div class="actions">
        <button class="btn primary" onclick="buildDeck()">Nouvelle session</button>
        <button class="btn" onclick="openStats()">Voir mes stats</button>
        <button class="btn" onclick="openExport()">Exporter</button>
      </div>
    </div>`;
}

function nextCard(){ G.i++; G.status="idle"; G.flipped=false; G.lastAnswer=""; render(); }
function prevCard(){ if(G.i>0){G.i--; G.status="idle"; G.flipped=false; render();} }

function startSession(){ buildDeck(); }

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener("keydown", e=>{
  if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if(e.key === " "){ e.preventDefault();
    if(G.mode === "flash") flipCard();
    else if(G.status !== "idle") nextCard();
  }
  if(e.key === "ArrowRight"){ if(G.status !== "idle") nextCard(); }
  if(e.key === "ArrowLeft"){ prevCard(); }
  if(e.key === "p" || e.key === "P"){ const c = G.deck[G.i]; if(c) speak(c.en); }
  if(e.key === "s" || e.key === "S"){ openStats(); }
  if(e.key === "e" || e.key === "E"){ openExport(); }
  if(e.key === "Escape"){ closeModal(); }
});

/* ===== Export builders ===== */
function buildJSON(){ return JSON.stringify(VOCAB, null, 2); }
function csvEscape(s){ s = (s==null?"":String(s)).replace(/"/g,'""'); return /[",\n]/.test(s) ? `"${s}"` : s; }
function buildCSV(){
  const cols = ["English","French","Category","Type","Tags","Explanation","Example1","Example2","IPA","PronunciationTip","Synonyms","Mistakes","MemoryTip"];
  const rows = VOCAB.map(v=>[v.en,v.fr,v.cat,v.type,(v.tags||[]).join("|"),v.exp,v.ex,v.ex2,v.ipa,v.tip,(v.syn||[]).join(", "),v.err,v.mem].map(csvEscape).join(","));
  return cols.join(",") + "\n" + rows.join("\n");
}
function highlightAnki(text, term){
  if(!text || !term) return text || "";
  try{
    const esc = term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return text.replace(new RegExp(`(${esc})`,"gi"),'<b class="hl">$1</b>');
  }catch(e){ return text; }
}
function buildAnkiTSV(){
  // Rich HTML matching the web app. Style lives in card template (Styling tab).
  const rows = VOCAB.map(v=>{
    const front =
      `<div class="bep">`+
        `<div class="tagrow">`+
          `<span class="tag">${v.cat}</span>`+
          `<span class="tag type">${v.type}</span>`+
        `</div>`+
        `<div class="term">${v.en}</div>`+
        `<div class="ipa">${v.ipa}</div>`+
        `<div class="example">"${highlightAnki(v.ex, v.en)}"</div>`+
      `</div>`;
    const back =
      `<div class="bep back">`+
        `<div class="fr">${v.fr}</div>`+
        `<div class="def"><b>Definition.</b> ${v.exp}</div>`+
        `<div class="example">"${highlightAnki(v.ex, v.en)}"</div>`+
        `<div class="example example-2">"${highlightAnki(v.ex2, v.en)}"</div>`+
        `<div class="meta">`+
          `<div class="box tip"><div class="lab">🗣️ Pronunciation (FR)</div><div class="v">${v.tip}</div></div>`+
          `<div class="box err"><div class="lab">⚠️ Common mistake</div><div class="v">${v.err}</div></div>`+
          `<div class="box mem"><div class="lab">🧠 Memory tip</div><div class="v">${v.mem}</div></div>`+
          (v.syn.length?`<div class="box syn"><div class="lab">🔁 Synonyms</div><div class="v">${v.syn.join(", ")}</div></div>`:"")+
        `</div>`+
      `</div>`;
    const tags = (v.tags||[]).map(t=>t.replace(/\s+/g,"_")).join(" ") + " cat_" + v.cat.toLowerCase().replace(/\s+/g,"_");
    // single-line cells: strip newlines/tabs from HTML
    const oneLine = s => s.replace(/[\r\n\t]+/g," ");
    return [oneLine(front), oneLine(back), tags].join("\t");
  });
  return "#separator:tab\n#html:true\n#tags column:3\n#notetype:Basic\n#deck:Business English Pro\n" + rows.join("\n");
}

function copyToClipboard(text, label){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast(`✓ ${label} copié`,"ok"));
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(`✓ ${label} copié`,"ok"); }catch(e){ toast("Copie échouée","ko"); }
    ta.remove();
  }
}

function buildMarkdown(){
  let md = `# Business English Pro · ${VOCAB.length} Terms\n\n*For French native speakers targeting CSM / AE / SaaS / Cloud / AI roles.*\n\n`;
  for(const v of VOCAB){
    md += `## ${v.i}. ${v.en} — *${v.fr}*\n\n`;
    md += `**Category:** ${v.cat} · **Type:** ${v.type} · **Tags:** ${(v.tags||[]).join(", ")}\n\n`;
    md += `**IPA:** \`${v.ipa}\`\n\n`;
    md += `**Definition.** ${v.exp}\n\n`;
    md += `> ${v.ex}\n>\n> ${v.ex2}\n\n`;
    md += `- 🗣️ **Pronunciation (FR):** ${v.tip}\n`;
    md += `- ⚠️ **Common mistake:** ${v.err}\n`;
    md += `- 🧠 **Memory tip:** ${v.mem}\n`;
    if(v.syn.length) md += `- 🔁 **Synonyms:** ${v.syn.join(", ")}\n`;
    md += "\n---\n\n";
  }
  return md;
}
function download(name, content, type="text/plain;charset=utf-8"){
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 200);
}
