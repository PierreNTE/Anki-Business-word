<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business English Pro · SaaS · Cloud · AI</title>
<meta name="description" content="100 termes Business English pour SaaS, Customer Success, Cloud & AI. App gamifiée avec audio, modes multiples, et export Anki.">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English Pro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0a0a0c; --bg-1:#101014; --bg-2:#16161b; --bg-3:#1d1d24;
  --line:#26262f; --line-2:#33333f;
  --text:#f4f4f5; --muted:#a1a1aa; --dim:#71717a;
  --accent:#7c5cff; --accent-2:#5b8cff; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --pink:#ec4899;
  --grad:linear-gradient(135deg,#7c5cff 0%,#5b8cff 60%,#22d3ee 100%);
  --r-sm:8px; --r:12px; --r-lg:18px;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 24px 60px -20px rgba(0,0,0,.6);
  --font:ui-sans-serif,-apple-system,"Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,monospace;
}
[data-theme="light"]{
  --bg:#fafafa; --bg-1:#fff; --bg-2:#f4f4f5; --bg-3:#e4e4e7;
  --line:#e4e4e7; --line-2:#d4d4d8;
  --text:#0a0a0c; --muted:#52525b; --dim:#71717a;
  --shadow:0 1px 0 rgba(0,0,0,.02) inset, 0 24px 60px -20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; min-height:100vh;
  background-image:
    radial-gradient(60% 50% at 50% 0%,rgba(124,92,255,.10),transparent 60%),
    radial-gradient(40% 40% at 100% 10%,rgba(34,211,238,.06),transparent 60%);
}
button{font-family:inherit;color:inherit}
input{font-family:inherit;color:inherit}

/* ===== Layout ===== */
.shell{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand .logo{width:28px;height:28px;border-radius:9px;background:var(--grad);box-shadow:0 6px 20px -6px rgba(124,92,255,.6)}
.brand small{color:var(--muted);font-weight:500;font-size:12px;margin-left:6px}
.topbar .spacer{flex:1}
.kbd{font-family:var(--mono);font-size:11px;background:var(--bg-2);border:1px solid var(--line);padding:2px 6px;border-radius:6px;color:var(--muted)}

/* ===== HUD (XP / streak / level) ===== */
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--bg-1);border:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:500}
.chip b{color:var(--text);font-weight:600}
.chip.xp b{color:var(--accent)}
.chip.streak b{color:var(--amber)}
.chip.lvl b{color:var(--accent-2)}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--bg-1);border:1px solid var(--line);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s}
.icon-btn:hover{background:var(--bg-2);color:var(--text)}

/* ===== Mode tabs ===== */
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;padding:6px;background:var(--bg-1);border:1px solid var(--line);border-radius:14px;width:fit-content;max-width:100%;overflow-x:auto}
.mode-btn{padding:8px 14px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.mode-btn:hover{color:var(--text)}
.mode-btn.active{background:var(--bg-3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}

/* ===== Filters ===== */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filter-group{display:flex;gap:4px;flex-wrap:wrap}
.filter-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-right:6px;align-self:center}
.f-btn{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:.15s;font-weight:500}
.f-btn:hover{color:var(--text);border-color:var(--line-2)}
.f-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.f-btn.accent.active{background:rgba(124,92,255,.18);color:#c4b5fd;border-color:rgba(124,92,255,.45)}
.voice-select{min-width:min(420px,100%);max-width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);font-size:13px;outline:none}
.voice-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}

/* ===== Progress ===== */
.progress{height:4px;background:var(--bg-2);border-radius:4px;overflow:hidden;margin-bottom:18px}
.progress > div{height:100%;background:var(--grad);transition:width .4s ease;border-radius:4px}

/* ===== Card ===== */
.stage{display:grid;gap:14px}
.card{
  background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;
  box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(124,92,255,.04),transparent 40%);pointer-events:none}
.card.ok{border-color:rgba(34,197,94,.4)}
.card.ko{border-color:rgba(239,68,68,.4)}
.card .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:relative}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:var(--bg-2);border:1px solid var(--line);color:var(--muted);text-transform:uppercase}
.tag.lvl-A2{color:#86efac;border-color:rgba(134,239,172,.3)}
.tag.lvl-B1{color:#7dd3fc;border-color:rgba(125,211,252,.3)}
.tag.lvl-B2{color:#fbbf24;border-color:rgba(251,191,36,.3)}
.tag.type{color:var(--accent);border-color:rgba(124,92,255,.3)}
.cardnum{font-family:var(--mono);font-size:12px;color:var(--dim)}

.term-row{display:flex;align-items:center;gap:12px;margin:6px 0 8px;flex-wrap:wrap}
.term{font-size:clamp(28px,4vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.ipa{font-family:var(--mono);color:var(--muted);font-size:14px}
.audio-row{display:flex;gap:6px}
.audio-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);font-size:12px;cursor:pointer;transition:.15s;font-weight:500}
.audio-btn:hover{border-color:var(--accent);color:var(--accent)}
.audio-btn.slow{color:var(--muted)}
.audio-btn.speaking{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}

.fr-prompt{font-size:clamp(22px,3vw,30px);font-weight:600;letter-spacing:-.01em;line-height:1.2}

.example{font-size:14px;color:var(--muted);font-style:italic;padding:14px 16px;background:var(--bg-2);border-radius:var(--r);border-left:2px solid var(--accent);margin-top:14px;line-height:1.55}
.example b{color:var(--text);font-style:normal;font-weight:600;background:rgba(124,92,255,.18);padding:0 3px;border-radius:3px}

.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:16px}
.meta .box{padding:12px 14px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);font-size:13px;line-height:1.5}
.meta .box .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:4px;font-weight:600}
.meta .box .v{color:var(--text)}
.meta .box.err{border-color:rgba(239,68,68,.25)}
.meta .box.tip{border-color:rgba(34,197,94,.25)}
.meta .box.mem{border-color:rgba(245,158,11,.25)}

.input-row{display:flex;gap:8px;margin-top:18px}
.tinput{flex:1;padding:13px 16px;font-size:15px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg-2);color:var(--text);outline:none;transition:.15s}
.tinput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
.tinput.ok{border-color:var(--green);background:rgba(34,197,94,.08)}
.tinput.ko{border-color:var(--red);background:rgba(239,68,68,.08)}
.btn{padding:13px 18px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--bg-2);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--bg-3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 30px -10px rgba(124,92,255,.6)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}

.feedback{margin-top:12px;padding:12px 14px;border-radius:var(--r);font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.feedback.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac}
.feedback.ko{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.feedback .ico{font-size:18px;line-height:1}
.feedback .lab{display:block;font-weight:600;margin-bottom:2px}
.feedback strong{color:#fff}

.hint{font-size:12px;color:var(--dim);text-align:center;margin-top:10px}
.hint .kbd{background:var(--bg-2)}

/* ===== Flashcard reveal ===== */
.flash-card{display:grid;gap:14px}
.flash-card .side-label{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.flash-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* ===== Timed ===== */
.timer{font-family:var(--mono);font-size:13px;color:var(--muted)}
.timer.warn{color:var(--amber)}
.timer.crit{color:var(--red)}
.timer-bar{height:4px;background:var(--bg-2);border-radius:4px;overflow:hidden;margin-top:6px}
.timer-bar > div{height:100%;background:linear-gradient(90deg,var(--green),var(--amber),var(--red));transition:width .2s linear}

/* ===== Complete screen ===== */
.complete{text-align:center;padding:48px 20px;background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.complete .big{font-size:64px;font-weight:700;font-family:var(--mono);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:18px 0;letter-spacing:-.02em}
.complete h2{font-size:24px;font-weight:600;margin-bottom:6px}
.complete p{color:var(--muted);font-size:14px;margin-bottom:24px}
.complete .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ===== Stats panel ===== */
.panel{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow)}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px;font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{padding:14px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpi .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-lg);max-width:520px;width:100%;padding:24px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{font-size:18px;font-weight:600;margin-bottom:14px}
.modal .row{display:grid;gap:8px;margin-bottom:14px}
.modal .row .l{font-size:12px;color:var(--muted)}
.modal .close{float:right;cursor:pointer;color:var(--muted);font-size:20px;background:none;border:none}

/* ===== Weak words list ===== */
.wlist{display:grid;gap:6px;max-height:240px;overflow:auto}
.witem{display:flex;justify-content:space-between;padding:8px 10px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;font-size:13px}
.witem .b{font-weight:600}
.witem .s{color:var(--red);font-family:var(--mono);font-size:12px}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-3);border:1px solid var(--line-2);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(34,197,94,.5);color:#86efac}
.toast.xp{border-color:rgba(124,92,255,.5);color:#c4b5fd}

/* ===== Welcome ===== */
.welcome{text-align:center;padding:48px 20px}
.welcome h1{font-size:clamp(32px,5vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-bottom:14px}
.welcome h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--muted);font-size:16px;max-width:560px;margin:0 auto 28px;line-height:1.55}
.welcome .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ===== SR helpers ===== */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media (max-width:640px){
  .shell{padding:16px 14px 60px}
  .card{padding:22px 18px}
  .meta{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="shell">

  <!-- ========== TOPBAR ========== -->
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <span>Business English Pro</span>
      <small>SaaS · Cloud · AI · CSM · AE</small>
    </div>
    <div class="spacer"></div>
    <div class="hud" id="hud">
      <span class="chip lvl" title="Niveau"><b id="hud-lvl">1</b> Level</span>
      <span class="chip xp" title="Expérience">⚡ <b id="hud-xp">0</b> XP</span>
      <span class="chip streak" title="Série quotidienne">🔥 <b id="hud-streak">0</b></span>
      <button class="icon-btn" id="btn-stats" title="Statistiques (S)" aria-label="Statistiques">📊</button>
      <button class="icon-btn" id="btn-export" title="Exporter (E)" aria-label="Exporter">⬇</button>
      <button class="icon-btn" id="btn-theme" title="Thème" aria-label="Changer le thème">🌓</button>
    </div>
  </header>

  <!-- ========== MAIN ========== -->
  <main id="main"></main>

</div>

<div class="modal-bg" id="modal-bg" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   DATA · 100 entries · Business English for SaaS / Cloud / AI
   Each entry: i, en, fr, type, lvl, cat, tags, exp, ex, ex2,
               ipa, tip, syn, err, mem, alts
   ============================================================ */
const VOCAB = [
{i:1,en:"Pipeline",fr:"Pipeline commercial",type:"noun",lvl:"B1",cat:"Sales",tags:["sales","forecasting"],exp:"All the deals a sales rep is currently working on.",ex:"Our Q4 pipeline shows $2M in qualified opportunities.",ex2:"I'll add this account to my pipeline after the discovery call.",ipa:"/ˈpaɪp.laɪn/",tip:"Accent sur la 1re syllabe : PIPE-lyne, pas pi-pe-LINE.",syn:["sales funnel","book of business"],err:"Ne dites pas « le pipe » seul ; toujours « pipeline ».",mem:"Imaginez les deals coulant dans un tuyau vers le revenu.",alts:["pipeline","pipeline de vente","pipeline commercial"]},
{i:2,en:"Forecast",fr:"Prévision des ventes",type:"noun",lvl:"B1",cat:"Sales",tags:["sales","metrics","meetings"],exp:"A prediction of how much revenue will close in a given period.",ex:"My forecast for this quarter is 1.4 million in committed deals.",ex2:"Sales leadership reviews the forecast every Monday morning.",ipa:"/ˈfɔːr.kæst/",tip:"« FOR-cast », pas « for-CAST ». Le 'a' est court.",syn:["projection","sales projection"],err:"Évitez « forecast of sales » : dites simplement « sales forecast ».",mem:"Fore (avant) + cast (lancer) = lancer un chiffre à l'avance.",alts:["prevision","prévision","prévision des ventes","prévisions"]},
{i:3,en:"Quota",fr:"Quota / Objectif de vente",type:"noun",lvl:"B1",cat:"Sales",tags:["sales","metrics"],exp:"A revenue target a salesperson must hit, usually quarterly.",ex:"She crushed her quota last quarter — 130% to plan.",ex2:"If we close this enterprise deal, the whole team hits quota.",ipa:"/ˈkwoʊ.tə/",tip:"« KWOH-tuh », pas « koo-ota ». Le 'qu' = kw.",syn:["target","number"],err:"« My quota of » est rare ; on dit « hit / miss / blow past quota ».",mem:"Quota → quote → un chiffre que tu dois citer chaque trimestre.",alts:["quota","objectif","objectif de vente","objectif commercial"]},
{i:4,en:"Churn",fr:"Attrition / Résiliation",type:"noun",lvl:"B2",cat:"Customer Success",tags:["customer-success","metrics"],exp:"When customers cancel or stop paying for the product.",ex:"Reducing churn is our top priority for the next two quarters.",ex2:"A 5% monthly churn rate will destroy your ARR within a year.",ipa:"/tʃɜːrn/",tip:"Son « tch » initial comme dans « church ». Évitez « shurn ».",syn:["attrition","cancellation","logo churn"],err:"« Churn out » signifie produire en masse, pas perdre des clients.",mem:"Penser à la baratte (churn) qui agite le lait : agitation = clients qui partent.",alts:["attrition","résiliation","resiliation","churn","perte de clients"]},
{i:5,en:"Renewal",fr:"Renouvellement",type:"noun",lvl:"B1",cat:"Customer Success",tags:["customer-success","sales","contracts"],exp:"When a customer extends their contract for another term.",ex:"The renewal conversation should start 90 days before the contract ends.",ex2:"Auto-renewal clauses make life easier for both sides.",ipa:"/rɪˈnuː.əl/",tip:"« ri-NOO-ul » (3 syllabes). Le 'w' est presque muet.",syn:["contract extension","resign"],err:"Pas « renewment » (n'existe pas). Toujours « renewal ».",mem:"Re + new = rendre à nouveau neuf le contrat.",alts:["renouvellement","reconduction"]},
{i:6,en:"Upsell",fr:"Montée en gamme",type:"verb",lvl:"B2",cat:"Sales",tags:["sales","revenue","expansion"],exp:"To sell a more expensive version of what the customer already has.",ex:"We identified a clear upsell opportunity to the enterprise tier.",ex2:"Upselling existing accounts is 5x cheaper than acquiring new logos.",ipa:"/ˈʌp.sel/",tip:"Stress sur UP. 'u' court comme dans « cup ».",syn:["expansion","tier upgrade"],err:"Ne confondez pas avec « cross-sell » (produit différent).",mem:"UP = monter en gamme, SELL = vendre.",alts:["montee en gamme","montée en gamme","vente additionnelle","upsell"]},
{i:7,en:"Cross-sell",fr:"Vente croisée",type:"verb",lvl:"B2",cat:"Sales",tags:["sales","revenue","expansion"],exp:"To sell a different product to the same customer.",ex:"Cross-selling our security module added 30K ARR per account.",ex2:"Strong cross-sell motion is what turns a product into a platform.",ipa:"/ˈkrɒs.sel/",tip:"Liaison fluide : « kross-sell », un seul mot.",syn:["product expansion"],err:"Pas « cross-selling to the same product » : c'est UN AUTRE produit.",mem:"CROSS = croiser des produits différents chez le même client.",alts:["vente croisee","vente croisée","cross-sell","ventes croisees"]},
{i:8,en:"ARR",fr:"Revenu Annuel Récurrent",type:"noun",lvl:"B2",cat:"Metrics",tags:["metrics","saas","revenue"],exp:"Annual Recurring Revenue — yearly subscription value.",ex:"We closed 500K in net new ARR this quarter.",ex2:"Investors care more about ARR growth than total revenue.",ipa:"/eɪ ɑːr ɑːr/",tip:"On épelle lettre par lettre : « EY-AR-AR ».",syn:["annual recurring revenue"],err:"Pas « an ARR » mais « an A-R-R » à l'oral : trois lettres.",mem:"A = Annual, R = Recurring, R = Revenue.",alts:["arr","revenu annuel recurrent","revenu annuel récurrent"]},
{i:9,en:"MRR",fr:"Revenu Mensuel Récurrent",type:"noun",lvl:"B2",cat:"Metrics",tags:["metrics","saas","revenue"],exp:"Monthly Recurring Revenue — predictable monthly subscription income.",ex:"MRR grew 18% month over month — best in our history.",ex2:"Track new MRR, expansion MRR, and churned MRR separately.",ipa:"/em ɑːr ɑːr/",tip:"« EM-AR-AR ». Bien marquer le M initial.",syn:["monthly recurring revenue"],err:"MRR × 12 ≠ ARR exact, à cause des annualisations ponctuelles.",mem:"M comme Monthly. La sœur cadette d'ARR.",alts:["mrr","revenu mensuel recurrent","revenu mensuel récurrent"]},
{i:10,en:"NRR",fr:"Rétention Nette des Revenus",type:"noun",lvl:"B2",cat:"Metrics",tags:["metrics","customer-success"],exp:"Net Revenue Retention — how much revenue you keep and grow from existing customers.",ex:"Our NRR sits at 118%, which means existing accounts are expanding.",ex2:"Best-in-class SaaS companies report NRR above 120%.",ipa:"/en ɑːr ɑːr/",tip:"« EN-AR-AR ». Trois lettres distinctes.",syn:["net dollar retention","NDR"],err:"NRR > 100% inclut l'expansion ; GRR ne l'inclut pas.",mem:"NET = ce qui reste après churn ET expansion.",alts:["nrr","retention nette des revenus","rétention nette des revenus","net revenue retention"]},
{i:11,en:"ACV",fr:"Valeur Annuelle du Contrat",type:"noun",lvl:"B2",cat:"Metrics",tags:["metrics","sales"],exp:"Annual Contract Value — yearly value of a single contract.",ex:"The average ACV for our enterprise segment is 95K.",ex2:"Upmarket motion increased our average ACV by 60% in one year.",ipa:"/eɪ siː viː/",tip:"« EY-SEE-VEE ». Bien détacher chaque lettre.",syn:["annual contract value"],err:"ACV ≠ ARR : ACV est par contrat, ARR est l'agrégat de tous.",mem:"A = Annual, C = Contract, V = Value.",alts:["acv","valeur annuelle du contrat"]},
{i:12,en:"CAC",fr:"Coût d'Acquisition Client",type:"noun",lvl:"B2",cat:"Metrics",tags:["metrics","marketing","sales"],exp:"Customer Acquisition Cost — what you spend to win one new customer.",ex:"Our blended CAC dropped 22% after we cut paid spend.",ex2:"The LTV-to-CAC ratio should be at least 3 to 1.",ipa:"/siː eɪ siː/",tip:"« SEE-EY-SEE ». Évitez de prononcer « kak ».",syn:["acquisition cost"],err:"Inclure SDR, AE, marketing — pas seulement le paid media.",mem:"C = Customer, A = Acquisition, C = Cost.",alts:["cac","cout d'acquisition client","coût d'acquisition client","cout d acquisition client"]},
{i:13,en:"LTV",fr:"Valeur Vie Client",type:"noun",lvl:"B2",cat:"Metrics",tags:["metrics","customer-success"],exp:"Lifetime Value — total revenue a customer generates over their lifetime.",ex:"Enterprise accounts deliver 8x the LTV of self-serve users.",ex2:"Improving onboarding directly increases LTV by reducing early churn.",ipa:"/el tiː viː/",tip:"« EL-TEE-VEE ». Souvent dit « LTV » sans hésitation.",syn:["customer lifetime value","CLV"],err:"LTV brute ≠ LTV en marge ; précisez selon le contexte.",mem:"L = Lifetime, T = (the), V = Value.",alts:["ltv","valeur vie client","valeur a vie du client","clv"]},
{i:14,en:"TCO",fr:"Coût Total de Possession",type:"noun",lvl:"B2",cat:"Cloud",tags:["cloud","sales","metrics"],exp:"Total Cost of Ownership — full cost including licenses, ops, training.",ex:"The TCO analysis showed 38% savings versus their on-prem setup.",ex2:"Cloud TCO must include egress fees, not just compute.",ipa:"/tiː siː oʊ/",tip:"« TEE-SEE-OH ». Argument clé en vente cloud.",syn:["total cost of ownership"],err:"TCO inclut les coûts cachés (formation, maintenance), pas juste le prix.",mem:"T = Total, C = Cost, O = Ownership.",alts:["tco","cout total de possession","coût total de possession"]},
{i:15,en:"ROI",fr:"Retour sur Investissement",type:"noun",lvl:"B1",cat:"Sales",tags:["sales","metrics","negotiation"],exp:"Return on Investment — what the buyer gets back versus what they spend.",ex:"We need to prove a clear ROI within the first six months.",ex2:"The business case shows 4x ROI over a three-year horizon.",ipa:"/ɑːr oʊ aɪ/",tip:"« AR-OH-EYE ». Ne dites pas « roy ».",syn:["return on investment","payback"],err:"« What's the ROI? » est plus naturel que « What ROI? ».",mem:"R = Return, O = On, I = Investment.",alts:["roi","retour sur investissement"]},
{i:16,en:"SaaS",fr:"Logiciel en tant que Service",type:"noun",lvl:"B1",cat:"Cloud",tags:["cloud","saas"],exp:"Software-as-a-Service — software delivered via subscription in the cloud.",ex:"Moving to a SaaS model eliminated all infrastructure overhead.",ex2:"Most modern SaaS companies follow a product-led growth motion.",ipa:"/sæs/",tip:"Une syllabe, comme « sass ». Évitez « SA-AS ».",syn:["software-as-a-service"],err:"« A SaaS » est OK ; « SaaSes » au pluriel est argotique.",mem:"S-a-a-S : Software-as-a-Service.",alts:["saas","logiciel en tant que service"]},
{i:17,en:"PaaS",fr:"Plateforme en tant que Service",type:"noun",lvl:"B2",cat:"Cloud",tags:["cloud"],exp:"Platform-as-a-Service — managed dev platform (runtime, DB, deploy).",ex:"Our PaaS lets developers ship features without managing servers.",ex2:"Heroku and Vercel are textbook PaaS examples.",ipa:"/pæs/",tip:"Une syllabe : « pass ».",syn:["platform-as-a-service"],err:"PaaS ≠ IaaS : PaaS gère le runtime, pas seulement l'infra.",mem:"P comme Platform.",alts:["paas","plateforme en tant que service"]},
{i:18,en:"IaaS",fr:"Infrastructure en tant que Service",type:"noun",lvl:"B2",cat:"Cloud",tags:["cloud","infrastructure"],exp:"Infrastructure-as-a-Service — raw compute, storage, networking.",ex:"IaaS gives full flexibility but more operational responsibility.",ex2:"AWS EC2 and Azure Virtual Machines are core IaaS offerings.",ipa:"/aɪ æs/",tip:"Deux syllabes : « EYE-ass ».",syn:["infrastructure-as-a-service"],err:"Avec IaaS, le client gère encore l'OS et les patches.",mem:"I comme Infrastructure (la fondation).",alts:["iaas","infrastructure en tant que service"]},
{i:19,en:"Cloud-native",fr:"Natif cloud",type:"adjective",lvl:"B2",cat:"Cloud",tags:["cloud","architecture"],exp:"Built specifically for the cloud, not migrated from legacy systems.",ex:"Their cloud-native architecture deploys 50 times a day with zero downtime.",ex2:"Cloud-native apps rely on containers, microservices, and CI/CD.",ipa:"/klaʊd ˈneɪ.tɪv/",tip:"« klaoud NEY-tiv ». Liaison naturelle entre les deux mots.",syn:["born in the cloud"],err:"Migrer une app legacy ne la rend pas cloud-native automatiquement.",mem:"Né (native) dans le cloud, pas adopté.",alts:["natif cloud","cloud-native","cloud native","natif pour le cloud"]},
{i:20,en:"Multi-cloud",fr:"Multi-cloud",type:"adjective",lvl:"B2",cat:"Cloud",tags:["cloud","strategy"],exp:"Using more than one public cloud provider on purpose.",ex:"A multi-cloud strategy prevents vendor lock-in and improves resilience.",ex2:"Finance teams often go multi-cloud to negotiate better discounts.",ipa:"/ˈmʌl.ti klaʊd/",tip:"« MUL-ti klaoud ». 'i' bref, comme dans « happy ».",syn:["polycloud"],err:"Multi-cloud ≠ hybrid cloud (qui inclut l'on-prem).",mem:"Multi = plusieurs clouds publics.",alts:["multi-cloud","multicloud","multi cloud"]},
{i:21,en:"Hybrid cloud",fr:"Cloud hybride",type:"noun",lvl:"B2",cat:"Cloud",tags:["cloud","strategy"],exp:"A mix of public cloud and on-premise infrastructure.",ex:"Their hybrid cloud setup keeps sensitive data on-prem and bursts to public cloud.",ex2:"Hybrid cloud is common in regulated industries like banking and health.",ipa:"/ˈhaɪ.brɪd klaʊd/",tip:"« HAÏ-brid klaoud ». Ne dites pas « i-brid ».",syn:[],err:"Hybrid ≠ Multi-cloud : hybrid mélange privé et public.",mem:"Hybride = deux mondes (privé + public).",alts:["cloud hybride","hybrid cloud"]},
{i:22,en:"Migration",fr:"Migration",type:"noun",lvl:"B1",cat:"Cloud",tags:["cloud","implementation"],exp:"The process of moving systems or data from one environment to another.",ex:"The cloud migration is scheduled in three waves over six months.",ex2:"We'll run an assessment before kicking off the migration project.",ipa:"/maɪˈɡreɪ.ʃən/",tip:"« maï-GRÉ-shun ». Stress sur la 2e syllabe.",syn:["cutover","move"],err:"Verbe : « to migrate », pas « to migration ».",mem:"Comme les oiseaux qui migrent vers un nouvel environnement.",alts:["migration"]},
{i:23,en:"Lift and shift",fr:"Migration à l'identique",type:"expression",lvl:"B2",cat:"Cloud",tags:["cloud","strategy"],exp:"Moving workloads to the cloud as-is, with little or no refactoring.",ex:"A lift-and-shift gets you to the cloud fast, but you miss most cost benefits.",ex2:"Start with lift-and-shift, then refactor critical apps later.",ipa:"/lɪft ən ʃɪft/",tip:"Liaison « lift-AN-shift ». 'and' devient 'n'.",syn:["rehost"],err:"Cette approche n'utilise pas les services cloud natifs.",mem:"Tu soulèves (lift) et tu déplaces (shift), sans changer.",alts:["lift and shift","migration a l'identique","migration à l'identique","rehost"]},
{i:24,en:"Workload",fr:"Charge de travail",type:"noun",lvl:"B1",cat:"Cloud",tags:["cloud","infrastructure"],exp:"An application or set of services consuming compute resources.",ex:"Which workloads are you planning to move first?",ex2:"Mission-critical workloads need multi-region failover.",ipa:"/ˈwɜːrk.loʊd/",tip:"« WURK-loud ». 'or' = « eu » long.",syn:["application","workload type"],err:"Workload = un système entier, pas juste une tâche.",mem:"Work + load = la charge de travail à faire tourner.",alts:["charge de travail","workload"]},
{i:25,en:"Scalability",fr:"Scalabilité",type:"noun",lvl:"B2",cat:"Cloud",tags:["cloud","architecture"],exp:"The ability to handle more load by adding resources.",ex:"Scalability is non-negotiable for Black Friday traffic.",ex2:"Horizontal scalability beats vertical scalability for modern web apps.",ipa:"/ˌskeɪ.ləˈbɪl.ə.ti/",tip:"« skay-la-BI-li-ti ». Stress sur BI.",syn:["scale"],err:"« Scalable » (adj) ≠ « scalability » (nom). Ne pas mélanger.",mem:"Comme une échelle (scale) : tu rajoutes des barreaux.",alts:["scalabilite","scalabilité","passage a l'echelle"]},
{i:26,en:"Elasticity",fr:"Élasticité",type:"noun",lvl:"B2",cat:"Cloud",tags:["cloud"],exp:"The ability to automatically grow and shrink resources on demand.",ex:"Cloud elasticity means you only pay for what you actually use.",ex2:"Black Friday is the perfect test of true elasticity.",ipa:"/iˌlæsˈtɪs.ə.ti/",tip:"« i-las-TI-si-ti ». Stress sur TI.",syn:["auto-scaling"],err:"Elasticity ≠ scalability : elasticity descend aussi quand la charge baisse.",mem:"Un élastique : ça monte ET ça redescend.",alts:["elasticite","élasticité"]},
{i:27,en:"Proof of Concept",fr:"Preuve de concept (PoC)",type:"noun",lvl:"B2",cat:"Sales",tags:["sales","evaluation"],exp:"A short trial to validate a solution before buying.",ex:"We're running a 30-day PoC against three critical use cases.",ex2:"Define exit criteria before kicking off the PoC.",ipa:"/pruːf əv ˈkɒn.sept/",tip:"« proof of KON-sept ». Souvent dit « PoC » : « pi-oh-si » ou « pok ».",syn:["pilot","trial"],err:"Pas de PoC sans critères de succès écrits — sinon il s'éternise.",mem:"PROUVER que le concept marche avant de signer.",alts:["preuve de concept","poc","proof of concept"]},
{i:28,en:"RFP",fr:"Appel d'offres",type:"noun",lvl:"B2",cat:"Sales",tags:["sales","procurement"],exp:"Request for Proposal — formal document asking vendors to bid.",ex:"We just received a competitive RFP from a Fortune 500 buyer.",ex2:"Bid/no-bid decisions should happen within 48 hours of receiving an RFP.",ipa:"/ɑːr ef piː/",tip:"« AR-EF-PI ». Trois lettres distinctes.",syn:["request for proposal","tender"],err:"RFI (information) précède souvent l'RFP (proposal).",mem:"R = Request, F = For, P = Proposal.",alts:["rfp","appel d'offres","appel d offres"]},
{i:29,en:"SLA",fr:"Accord de niveau de service",type:"noun",lvl:"B2",cat:"Legal",tags:["legal","contracts","cloud"],exp:"Service Level Agreement — a promise on uptime, response time, etc.",ex:"Our SLA guarantees 99.99% uptime for enterprise customers.",ex2:"SLA breaches trigger automatic service credits, not refunds.",ipa:"/es el eɪ/",tip:"« ES-EL-EY ». Trois lettres claires.",syn:["service level agreement"],err:"SLA ≠ SLO : SLO est l'objectif interne, SLA l'engagement contractuel.",mem:"S = Service, L = Level, A = Agreement.",alts:["sla","accord de niveau de service"]},
{i:30,en:"Discovery call",fr:"Appel de découverte",type:"noun",lvl:"B1",cat:"Sales",tags:["sales","meetings"],exp:"The first qualifying call where you learn the prospect's pain points.",ex:"The discovery call uncovered three urgent business priorities.",ex2:"A good discovery call is 80% listening and 20% talking.",ipa:"/dɪˈskʌv.ər.i kɔːl/",tip:"« dis-KE-veu-ri kol ». Stress sur KE.",syn:["discovery","disco call"],err:"Évitez de pitcher pendant la discovery : posez des questions.",mem:"Découvrir (discover) avant de proposer.",alts:["appel de decouverte","appel de découverte","decouverte","découverte"]},
{i:31,en:"Champion",fr:"Champion interne",type:"noun",lvl:"B2",cat:"Sales",tags:["sales","stakeholders"],exp:"An internal advocate who actively sells your solution inside their company.",ex:"Sarah is our champion — she's presenting the business case to the board.",ex2:"No deal closes without a clearly identified champion.",ipa:"/ˈtʃæm.pi.ən/",tip:"« TCHAM-pi-en ». Le 'ch' = « tch » comme dans « chat (animal) ».",syn:["internal advocate","coach"],err:"Un champion n'est pas forcément le décideur final.",mem:"Le champion porte vos couleurs en interne.",alts:["champion","champion interne","ambassadeur"]},
{i:32,en:"Stakeholder",fr:"Partie prenante",type:"noun",lvl:"B2",cat:"Sales",tags:["sales","stakeholders","meetings"],exp:"Anyone with an interest or influence in the buying decision.",ex:"Map every stakeholder before sending the final proposal.",ex2:"Misalignment between stakeholders is the number-one reason deals stall.",ipa:"/ˈsteɪkˌhoʊl.dər/",tip:"« STÉIK-hold-eur ». Pas « stak-holder ».",syn:["decision influencer","party"],err:"« Stakeholders » au pluriel sans 's' supplémentaire.",mem:"Stake (enjeu) + holder (détenteur) = celui qui a un enjeu.",alts:["partie prenante","interlocuteur cle","interlocuteur clé","stakeholder"]},
{i:33,en:"Executive sponsor",fr:"Sponsor exécutif",type:"noun",lvl:"B2",cat:"Sales",tags:["sales","stakeholders"],exp:"A senior leader who backs the deal and protects it internally.",ex:"Getting the CTO as executive sponsor accelerated the deal by two months.",ex2:"Without an exec sponsor, large deals tend to slip every quarter.",ipa:"/ɪɡˈzek.jə.tɪv ˈspɒn.sər/",tip:"« ig-ZEK-iou-tiv SPON-seur ».",syn:["exec sponsor","C-level sponsor"],err:"Sponsor ne signifie pas « décideur final » — c'est un protecteur senior.",mem:"Un parrain (sponsor) en haut de la hiérarchie.",alts:["sponsor executif","sponsor exécutif","parrain executif"]},
{i:34,en:"QBR",fr:"Bilan trimestriel client",type:"noun",lvl:"B2",cat:"Customer Success",tags:["customer-success","meetings"],exp:"Quarterly Business Review — a meeting to review value delivered and align on next steps.",ex:"The QBR is your chance to showcase ROI and unlock the next expansion.",ex2:"Always co-build the QBR agenda with your champion.",ipa:"/kjuː biː ɑːr/",tip:"« KIOU-BI-AR ». Trois lettres bien détachées.",syn:["quarterly business review"],err:"QBR sans données mesurées = perte de temps pour le client.",mem:"Q = Quarterly, B = Business, R = Review.",alts:["qbr","bilan trimestriel","quarterly business review"]},
{i:35,en:"Onboarding",fr:"Intégration / Prise en main",type:"noun",lvl:"B1",cat:"Customer Success",tags:["customer-success","implementation"],exp:"The process of getting a new customer set up and successful.",ex:"A smooth onboarding reduces time-to-value by 40%.",ex2:"Our 30-60-90 onboarding plan covers setup, adoption, and value review.",ipa:"/ˈɒnˌbɔːr.dɪŋ/",tip:"« ON-bor-ding ». 'ing' final léger.",syn:["enablement","activation"],err:"Onboarding ≠ implementation : l'un est humain, l'autre technique.",mem:"On + boarding = monter à bord du produit.",alts:["onboarding","integration","intégration","prise en main"]},
{i:36,en:"Adoption",fr:"Adoption",type:"noun",lvl:"B1",cat:"Customer Success",tags:["customer-success","metrics"],exp:"How deeply and widely customers actually use the product.",ex:"Low adoption is an early warning sign of churn.",ex2:"We track adoption at the user, team, and feature level.",ipa:"/əˈdɒp.ʃən/",tip:"« a-DOP-shun ». Stress sur DOP.",syn:["usage","engagement"],err:"Logins ≠ adoption. Mesurez des actions à valeur métier.",mem:"Adopter le produit comme un nouveau membre de l'équipe.",alts:["adoption"]},
{i:37,en:"Health score",fr:"Score de santé client",type:"noun",lvl:"B2",cat:"Customer Success",tags:["customer-success","metrics"],exp:"A composite metric showing how likely a customer is to renew.",ex:"His health score dropped to red after the main champion left.",ex2:"Build the health score from usage, NPS, support tickets, and sentiment.",ipa:"/helθ skɔːr/",tip:"« helth skor ». Le 'th' est sourd, comme « think ».",syn:["customer health"],err:"Un score basé sur un seul signal = score trompeur.",mem:"Comme un check-up médical du compte.",alts:["score de sante","score de santé","health score","score de sante client"]},
{i:38,en:"Success plan",fr:"Plan de succès",type:"noun",lvl:"B2",cat:"Customer Success",tags:["customer-success","strategy"],exp:"A shared roadmap of milestones to reach the customer's business outcomes.",ex:"We co-built a success plan with quarterly business milestones.",ex2:"A success plan should always tie back to the customer's KPIs.",ipa:"/səkˈses plæn/",tip:"« suk-SES plan ». Stress sur SES.",syn:["success roadmap","mutual action plan"],err:"Pas un plan interne caché — il se co-construit avec le client.",mem:"Le plan partagé pour atteindre le succès ensemble.",alts:["plan de succes","plan de succès"]},
{i:39,en:"Time-to-value",fr:"Délai de création de valeur",type:"noun",lvl:"B2",cat:"Customer Success",tags:["customer-success","metrics","onboarding"],exp:"How long it takes a customer to get the first measurable value from the product.",ex:"Reducing time-to-value from 60 to 21 days cut early churn by half.",ex2:"Onboarding teams obsess over time-to-value.",ipa:"/taɪm tə ˈvæl.juː/",tip:"« taïm tu VA-liou ». Liaison nette.",syn:["TTV","time-to-first-value"],err:"Le TTV se mesure côté client, pas côté setup interne.",mem:"Compte à rebours jusqu'au premier vrai gain.",alts:["delai de creation de valeur","délai de création de valeur","time to value","ttv"]},
{i:40,en:"Land and expand",fr:"Conquérir puis élargir",type:"expression",lvl:"B2",cat:"Sales",tags:["sales","strategy","expansion"],exp:"Start with a small contract, then grow it inside the same account.",ex:"We landed with one team of 20 users and expanded to 1,200 in 18 months.",ex2:"Land-and-expand requires strong onboarding to unlock the next deal.",ipa:"/lænd ən ɪkˈspænd/",tip:"« land an iks-PAND ». Liaison fluide.",syn:["wedge strategy"],err:"Sans plan de réussite, le « land » devient un mini-deal isolé.",mem:"Atterrir d'abord, puis étendre le territoire.",alts:["conquerir et elargir","conquérir et élargir","land and expand"]},
{i:41,en:"Whitespace",fr:"Potentiel inexploité",type:"noun",lvl:"B2",cat:"Sales",tags:["sales","strategy","expansion"],exp:"Untapped expansion opportunities within an existing account.",ex:"There's significant whitespace in their European subsidiaries.",ex2:"Whitespace mapping happens in every account planning session.",ipa:"/ˈwaɪt.speɪs/",tip:"« WAÏT-spéice ». Un seul mot.",syn:["expansion potential","untapped accounts"],err:"Whitespace ≠ pipeline : c'est du potentiel, pas du engagé.",mem:"L'espace blanc sur la carte du compte, à colorier.",alts:["potentiel inexploite","potentiel inexploité","whitespace"]},
{i:42,en:"Account mapping",fr:"Cartographie du compte",type:"noun",lvl:"B2",cat:"Sales",tags:["sales","stakeholders"],exp:"Identifying every relevant person inside a target account and their relationships.",ex:"Account mapping revealed three new buying centers we hadn't touched.",ex2:"A good account map shows roles, influence, and political dynamics.",ipa:"/əˈkaʊnt ˈmæp.ɪŋ/",tip:"« a-KAOUNT MAP-ing ».",syn:["org mapping","stakeholder mapping"],err:"Sans titres ET sans liens d'influence, ce n'est pas un account map utile.",mem:"Une carte du compte, comme une carte d'état-major.",alts:["cartographie du compte","account mapping"]},
{i:43,en:"Decision maker",fr:"Décideur",type:"noun",lvl:"B1",cat:"Sales",tags:["sales","stakeholders"],exp:"The person with formal authority to approve the purchase.",ex:"Who is the ultimate decision maker on this purchase?",ex2:"Enterprise deals typically have multiple decision makers.",ipa:"/dɪˈsɪʒ.ən ˈmeɪ.kər/",tip:"« di-SI-jeun MÉI-keur ». Stress sur SI.",syn:["DM","approver"],err:"Le « décideur déclaré » n'est pas toujours le vrai décideur.",mem:"Celui qui prend (make) la décision (decision).",alts:["decideur","décideur"]},
{i:44,en:"Economic buyer",fr:"Acheteur économique",type:"noun",lvl:"B2",cat:"Sales",tags:["sales","stakeholders","negotiation"],exp:"The person who controls the budget and can sign the check.",ex:"The CFO is the economic buyer — we need her aligned before pricing.",ex2:"Get to the economic buyer early, or the deal will stall at finance review.",ipa:"/iː.kəˈnɒm.ɪk ˈbaɪ.ər/",tip:"« i-keu-NO-mik BAÏ-eur ».",syn:["budget owner","check signer"],err:"L'économique n'est pas forcément l'utilisateur final.",mem:"Celui qui tient le porte-monnaie.",alts:["acheteur economique","acheteur économique","decideur budgetaire"]},
{i:45,en:"MEDDIC",fr:"Méthode de qualification MEDDIC",type:"noun",lvl:"B2",cat:"Sales",tags:["sales","methodology"],exp:"Sales qualification framework: Metrics, Economic buyer, Decision criteria, Decision process, Identify pain, Champion.",ex:"MEDDIC helps us decide which deals deserve our time.",ex2:"Run every late-stage opp through MEDDIC weekly.",ipa:"/ˈmed.ɪk/",tip:"« MÉ-dik ». Une seule syllabe forte.",syn:["MEDDICC","MEDDPICC"],err:"MEDDIC n'est pas un pitch, c'est un filtre de qualification.",mem:"Six lettres pour six points de qualification.",alts:["meddic","methode meddic","méthode meddic"]},
{i:46,en:"BANT",fr:"BANT (Budget, Autorité, Besoin, Délai)",type:"noun",lvl:"B1",cat:"Sales",tags:["sales","methodology"],exp:"Older qualification framework: Budget, Authority, Need, Timeline.",ex:"BANT is fast but often too shallow for complex enterprise deals.",ex2:"For SMB inbound, BANT is still a useful starting point.",ipa:"/bænt/",tip:"« bant », une syllabe. Le 'a' court comme « cat ».",syn:[],err:"BANT seul ne suffit pas pour les deals enterprise complexes.",mem:"B-A-N-T : 4 boîtes à cocher rapides.",alts:["bant","budget autorite besoin delai","budget autorité besoin délai"]},

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
const LS_KEY = "bep_state_v1";
const defaultState = () => ({
  xp:0, level:1, streak:0, lastDay:null,
  totals:{correct:0,wrong:0,sessions:0},
  // spaced repetition: per term { box:1..5, due:timestamp, wrong:0, right:0 }
  srs:{},
  weak:{},
  theme:"dark",
  prefs:{mode:"flash",cat:"All",lvl:"All",rate:0.95,accent:"en-US",voiceURI:""}
});
let S = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    return Object.assign(base, parsed, {
      totals:Object.assign(base.totals, parsed.totals || {}),
      prefs:Object.assign(base.prefs, parsed.prefs || {})
    });
  }catch(e){ return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* Daily streak update */
(function tickStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(S.lastDay !== today){
    if(S.lastDay){
      const a = new Date(S.lastDay), b = new Date(today);
      const diff = Math.round((b-a)/86400000);
      if(diff === 1) S.streak += 1;
      else if(diff > 1) S.streak = 1;
    } else S.streak = 1;
    S.lastDay = today;
    saveState();
  }
})();

/* ============================================================
   HELPERS
   ============================================================ */
function $(sel,root=document){return root.querySelector(sel)}
function $$(sel,root=document){return [...root.querySelectorAll(sel)]}
function normalize(s){
  return (s||"").toString().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[''`´]/g,"'")
    .replace(/[—–]/g,"-")
    .replace(/[.,!?;:]/g,"")
    .replace(/\s+/g," ").trim();
}
function escHtml(s){
  return (s==null?"":String(s)).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
}
function shuffle(arr){
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function highlight(text, term){
  if(!text || !term) return text;
  try{
    const escaped = term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return text.replace(new RegExp(`(${escaped})`,"gi"), "<b>$1</b>");
  }catch(e){ return text; }
}
function levelFromXp(xp){ return 1 + Math.floor(Math.sqrt(xp/40)); }
function nextLevelXp(lvl){ return Math.pow(lvl,2)*40; }

/* ===== Audio (Web Speech API) ===== */
let voices = [];
function loadVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  return voices;
}
if("speechSynthesis" in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); if($("#voice-select")) render(); };
}
function currentAccent(){ return S.prefs.accent === "en-GB" ? "en-GB" : "en-US"; }
function accentInfo(id=currentAccent()){ return ACCENTS.find(a=>a.id===id) || ACCENTS[0]; }
function voiceLang(v){ return (v.lang || "").replace("_","-"); }
function isEnglishVoice(v){ return /^en(-|$)/i.test(voiceLang(v)); }
function voiceLabel(v){ return `${v.name} (${voiceLang(v) || "English"})`; }
function scoreVoice(v, accentId){
  const accent = accentInfo(accentId);
  const lang = voiceLang(v);
  const name = v.name || "";
  let score = 0;
  if(new RegExp(`^${accent.id}$`,"i").test(lang)) score += 100;
  if(new RegExp(`^${accent.id.split("-")[0]}`,"i").test(lang)) score += 20;
  if(accent.names.some(rx=>rx.test(name))) score += 80;
  if(/Natural|Online|Premium|Enhanced/i.test(name)) score += 45;
  if(/Google|Microsoft|Apple/i.test(name)) score += 25;
  if(/Zira|David|Hazel|Susan/i.test(name)) score -= 20;
  if(v.localService) score += 5;
  return score;
}
function englishVoices(){
  return loadVoices()
    .filter(isEnglishVoice)
    .map(v=>({v,score:scoreVoice(v,currentAccent())}))
    .sort((a,b)=>b.score-a.score || voiceLabel(a.v).localeCompare(voiceLabel(b.v)))
    .map(x=>x.v);
}
function pickVoice(accentId=currentAccent()){
  const available = loadVoices().filter(isEnglishVoice);
  if(!available.length) return null;
  if(S.prefs.voiceURI){
    const chosen = available.find(v=>v.voiceURI === S.prefs.voiceURI);
    if(chosen) return chosen;
  }
  return available
    .map(v=>({v,score:scoreVoice(v,accentId)}))
    .sort((a,b)=>b.score-a.score)[0].v;
}
function setAccent(accentId){
  if(!ACCENTS.some(a=>a.id===accentId)) return;
  S.prefs.accent = accentId;
  S.prefs.voiceURI = "";
  saveState();
  toast(`Accent audio : ${accentInfo().label}`, "ok");
  render();
}
function setVoice(voiceURI){
  S.prefs.voiceURI = voiceURI || "";
  const v = englishVoices().find(x=>x.voiceURI === S.prefs.voiceURI);
  if(v && /^en-GB/i.test(voiceLang(v))) S.prefs.accent = "en-GB";
  if(v && /^en-US/i.test(voiceLang(v))) S.prefs.accent = "en-US";
  saveState();
  toast(v ? `Voix audio : ${v.name}` : "Voix audio : automatique", "ok");
  render();
}
function accentButtons(inline=false){
  return ACCENTS.map(a=>`<button class="f-btn accent ${currentAccent()===a.id?'active':''}" ${inline?`onclick="setAccent('${a.id}')"`:`data-accent="${a.id}"`} title="${a.label} English">${a.short}</button>`).join("");
}
function voiceSelect(){
  const list = englishVoices();
  if(!list.length) return `<p class="hint" style="margin-top:10px">Aucune voix anglaise détectée dans ce navigateur.</p>`;
  const options = list.map(v=>`<option value="${escHtml(v.voiceURI)}" ${S.prefs.voiceURI===v.voiceURI?'selected':''}>${escHtml(voiceLabel(v))}</option>`).join("");
  return `<select id="voice-select" class="voice-select" onchange="setVoice(this.value)" aria-label="Choisir une voix anglaise"><option value="">Auto · meilleure voix ${accentInfo().short}</option>${options}</select>`;
}
function speak(text, rate=null, btn=null){
  if(!("speechSynthesis" in window)){ toast("Audio non supporté par ce navigateur","ko"); return; }
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  const accent = currentAccent();
  const v = pickVoice(accent);
  if(v){
    utt.voice = v;
    utt.lang = voiceLang(v) || accent;
  } else {
    utt.lang = accent;
    if(voices.length){
      toast("Aucune voix anglaise trouvée. Installez une voix English US/UK sur l'appareil.", "ko");
      return;
    }
  }
  utt.rate = rate || S.prefs.rate || 0.95;
  utt.pitch = 1;
  if(btn){ btn.classList.add("speaking"); utt.onend = utt.onerror = ()=>btn.classList.remove("speaking"); }
  window.speechSynthesis.speak(utt);
}

/* ===== Toast ===== */
let toastTimer;
function toast(msg, kind=""){
  const t = $("#toast"); t.textContent = msg; t.className = "toast show " + kind;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.className = "toast " + kind; }, 2200);
}

/* ===== XP / scoring ===== */
function addXp(n, term){
  S.xp += n;
  const nl = levelFromXp(S.xp);
  if(nl > S.level){ S.level = nl; toast(`🎉 Level up! You are now level ${nl}`,"xp"); }
  saveState();
  refreshHud();
}
function refreshHud(){
  $("#hud-xp").textContent = S.xp;
  $("#hud-lvl").textContent = S.level;
  $("#hud-streak").textContent = S.streak;
}

/* ===== SRS (Leitner 5 boxes) ===== */
const BOX_INTERVALS_H = [0, 4, 24, 72, 168, 336]; // 1->4h, 2->1d, 3->3d, 4->7d, 5->14d
function srsRecord(id, ok){
  const now = Date.now();
  const r = S.srs[id] || {box:1,due:now,wrong:0,right:0};
  if(ok){ r.right++; r.box = Math.min(5, r.box+1); }
  else { r.wrong++; r.box = 1; S.weak[id] = (S.weak[id]||0)+1; }
  r.due = now + BOX_INTERVALS_H[r.box]*3600*1000;
  S.srs[id] = r;
  saveState();
}

/* ============================================================
   GAME ENGINE
   ============================================================ */
const G = {
  mode:"flash", cat:"All", lvl:"All",
  deck:[], i:0, status:"idle", session:{correct:0,wrong:0},
  flipped:false, timer:null, timeLeft:0, timeMax:30, lastAnswer:""
};

function buildDeck(){
  let d = VOCAB.slice();
  if(G.cat !== "All") d = d.filter(v=>v.cat === G.cat);
  if(G.lvl !== "All") d = d.filter(v=>v.lvl === G.lvl);
  // SRS priority: items due first, then newest
  d.sort((a,b)=>{
    const ra = S.srs[a.i]?.due ?? 0, rb = S.srs[b.i]?.due ?? 0;
    return ra - rb;
  });
  d = shuffle(d).slice(0, 20); // session of 20
  G.deck = d; G.i = 0; G.status = "idle"; G.session = {correct:0,wrong:0}; G.flipped = false;
  S.prefs.mode = G.mode; S.prefs.cat = G.cat; S.prefs.lvl = G.lvl; saveState();
  render();
}

function render(){
  if(!G.deck.length){
    $("#main").innerHTML = `
      <div class="welcome">
        <h1>Master <span>Business English</span> for SaaS, Cloud & AI.</h1>
        <p>100 termes natifs, audio, 5 modes de jeu, répétition espacée, et export Anki. Conçu pour les francophones visant un poste CSM, AE ou Sales en SaaS/AI/Cloud.</p>
        <div class="actions">
          <button class="btn primary" onclick="startSession()">Commencer · 20 cartes</button>
          <button class="btn" onclick="openExport()">Exporter Anki / CSV / JSON</button>
        </div>
      </div>`;
    return;
  }
  renderTabs();
  renderFilters();
  renderProgress();
  renderStage();
  refreshHud();
}

function renderTabs(){
  const html = MODES.map(m=>`<button class="mode-btn ${m.id===G.mode?'active':''}" data-mode="${m.id}">${m.icon} ${m.label}</button>`).join("");
  let bar = $("#mode-bar");
  if(!bar){
    bar = document.createElement("div"); bar.id = "mode-bar"; bar.className = "modes";
    $("#main").innerHTML = "";
    $("#main").appendChild(bar);
  }
  bar.innerHTML = html;
  bar.onclick = e => {
    const b = e.target.closest("[data-mode]"); if(!b) return;
    G.mode = b.dataset.mode; buildDeck();
  };
}

function renderFilters(){
  let row = $("#filters-row");
  if(!row){
    row = document.createElement("div"); row.id = "filters-row"; row.className = "filters";
    $("#main").appendChild(row);
  }
  row.innerHTML = `
    <span class="filter-label">Theme</span>
    <div class="filter-group">${CATEGORIES.map(c=>`<button class="f-btn ${c===G.cat?'active':''}" data-cat="${c}">${c}</button>`).join("")}</div>
    <span class="filter-label" style="margin-left:8px">Level</span>
    <div class="filter-group">${LEVELS.map(l=>`<button class="f-btn ${l===G.lvl?'active':''}" data-lvl="${l}">${l}</button>`).join("")}</div>
    <span class="filter-label" style="margin-left:8px">Accent</span>
    <div class="filter-group">${accentButtons(false)}</div>`;
  row.onclick = e => {
    const c = e.target.closest("[data-cat]"); const l = e.target.closest("[data-lvl]");
    const a = e.target.closest("[data-accent]");
    if(c){ G.cat = c.dataset.cat; buildDeck(); }
    if(l){ G.lvl = l.dataset.lvl; buildDeck(); }
    if(a){ setAccent(a.dataset.accent); }
  };
}

function renderProgress(){
  let p = $("#progress"); 
  if(!p){
    p = document.createElement("div"); p.id="progress"; p.className="progress"; p.innerHTML='<div></div>';
    $("#main").appendChild(p);
  }
  const pct = G.deck.length ? Math.round(G.i / G.deck.length * 100) : 0;
  p.querySelector("div").style.width = pct + "%";
}

function renderStage(){
  let stage = $("#stage");
  if(!stage){
    stage = document.createElement("div"); stage.id="stage"; stage.className="stage";
    $("#main").appendChild(stage);
  }
  if(G.i >= G.deck.length){ renderComplete(stage); return; }
  const card = G.deck[G.i];
  switch(G.mode){
    case "flash": renderFlash(stage, card); break;
    case "en2fr": renderTyping(stage, card, "en2fr"); break;
    case "fr2en": renderTyping(stage, card, "fr2en"); break;
    case "listen": renderListening(stage, card); break;
    case "timed": renderTimed(stage, card); break;
  }
}

function cardHeader(card){
  return `
    <div class="head">
      <div class="tagrow">
        <span class="tag">${card.cat}</span>
        <span class="tag lvl-${card.lvl}">${card.lvl}</span>
        <span class="tag type">${card.type}</span>
      </div>
      <span class="cardnum">${G.i+1} / ${G.deck.length}</span>

function answerFlash(ok){

/* ----- TYPING MODES ----- */
function renderTyping(stage, card, dir){
  const fromEn = dir === "en2fr";
  const prompt = fromEn ? card.en : card.fr;
  const ipa = fromEn ? card.ipa : "";
  const example = fromEn ? card.ex : card.ex2.replace(new RegExp(card.en, "gi"), "_____");
  const placeholder = fromEn ? "Traduction française…" : "English translation…";
  let inputClass = "tinput";
  if(G.status === "ok") inputClass += " ok";
  if(G.status === "ko") inputClass += " ko";
  const showFeedback = G.status !== "idle";
  let fb = "";
  if(G.status === "ok"){
    const target = fromEn ? card.fr : card.en;
    fb = `<div class="feedback ok"><span class="ico">✓</span><div><span class="lab">Correct!</span><strong>${target}</strong> · +15 XP</div></div>`;
  } else if(G.status === "ko" || G.status === "rev"){
    const target = fromEn ? card.fr : card.en;
    const yours = G.lastAnswer ? `<br><span style="opacity:.7">Votre réponse : « ${G.lastAnswer} »</span>` : "";
    fb = `<div class="feedback ko"><span class="ico">✗</span><div><span class="lab">${G.status==="rev"?"Réponse révélée":"Réponse incorrecte"}</span><strong>${target}</strong>${yours}</div></div>`;
  }
  stage.innerHTML = `
    <div class="card ${G.status==='ok'?'ok':''}${G.status==='ko'||G.status==='rev'?'ko':''}">
      ${cardHeader(card)}
      <div class="term-row">
        <span class="${fromEn?'term':'fr-prompt'}">${prompt}</span>
      </div>
      ${ipa?`<div class="ipa">${ipa}</div>`:""}
      <div style="margin-top:14px">${audioBtns(fromEn?card.en:card.en)}</div>
      <div class="example">"${highlight(example, fromEn?card.en:"_____")}"</div>
      <div class="input-row">
        <input id="ans" class="${inputClass}" placeholder="${placeholder}" autocomplete="off" autocorrect="off" spellcheck="false" ${G.status!=="idle"?"disabled":""}>
        ${G.status==="idle"
          ? `<button class="btn ghost" onclick="revealTyping()">Reveal</button><button class="btn primary" onclick="checkTyping('${dir}')">Check ⏎</button>`
          : `<button class="btn primary" onclick="nextCard()">${G.i>=G.deck.length-1?'Result':'Next →'}</button>`}
      </div>
      ${fb}
      ${G.status!=="idle"?metaPanels(card):""}
      <p class="hint"><span class="kbd">Enter</span> valider · <span class="kbd">Tab</span> reveal · <span class="kbd">→</span> suivant</p>
    </div>`;
  if(G.status === "idle"){
    const inp = $("#ans"); if(inp){ inp.focus(); inp.addEventListener("keydown", e=>{
      if(e.key==="Enter"){e.preventDefault(); checkTyping(dir);}
      if(e.key==="Tab"){e.preventDefault(); revealTyping();}
    });}
  }
}
function checkTyping(dir){
  const inp = $("#ans"); if(!inp) return;
  const userVal = normalize(inp.value); if(!userVal) return;
  G.lastAnswer = inp.value;
  const card = G.deck[G.i];
  let valid = [];
  if(dir === "en2fr"){
    valid = [card.fr, ...(card.alts||[])].map(normalize);
  } else {
    valid = [card.en, ...(card.alts||[]).filter(a=>/[a-z]/i.test(a) && !/[éèêàâîôùûç]/i.test(a))].map(normalize);
    // Also accept lowercased English plain form
    valid.push(normalize(card.en));
  }
  const ok = valid.includes(userVal);
  G.status = ok ? "ok" : "ko";
  if(ok){ G.session.correct++; addXp(15, card.en); srsRecord(card.i, true); }
  else  { G.session.wrong++; addXp(2, card.en); srsRecord(card.i, false); }
  render();
}
function revealTyping(){
  G.status = "rev"; const card = G.deck[G.i];
  G.session.wrong++; srsRecord(card.i, false); addXp(1, card.en);
  render();
}

function checkListen(){
  const inp = $("#ans"); if(!inp) return;
  const userVal = normalize(inp.value); if(!userVal) return;

  G.status = ok ? "ok" : "ko";

  else  { G.session.wrong++; addXp(2, card.en); srsRecord(card.i, false); }
  render();
}
function revealListen(){ G.status = "rev"; G.session.wrong++; srsRecord(G.deck[G.i].i, false); render(); }

/* ----- TIMED MODE ----- */
function renderTimed(stage, card){
  if(G.status === "idle" && !G.timer){
    G.timeLeft = G.timeMax;
    G.timer = setInterval(()=>{
      G.timeLeft -= 0.1;
      const bar = $("#timebar"); if(bar) bar.style.width = (G.timeLeft/G.timeMax*100) + "%";
      const t = $("#timeval"); if(t){
        t.textContent = G.timeLeft.toFixed(1)+"s";
        t.className = "timer" + (G.timeLeft<10?" warn":"") + (G.timeLeft<5?" crit":"");
      }
      if(G.timeLeft <= 0){ stopTimer(); G.status = "ko"; G.session.wrong++; srsRecord(card.i,false); render(); }
    }, 100);
  }
  renderTyping(stage, card, "en2fr");
  // inject timer
  const head = stage.querySelector(".head");
  if(head){
    const div = document.createElement("div");
    div.innerHTML = `<span class="timer" id="timeval">${G.timeMax.toFixed(1)}s</span>
      <div class="timer-bar"><div id="timebar" style="width:100%"></div></div>`;
    head.appendChild(div);
  }
}
function stopTimer(){ if(G.timer){ clearInterval(G.timer); G.timer = null; } }

/* ----- COMPLETE ----- */
function renderComplete(stage){
  const total = G.session.correct + G.session.wrong;
  const pct = total ? Math.round(G.session.correct/total*100) : 0;
  const cls = pct>=80?'score-green':pct>=60?'score-amber':'score-red';
  S.totals.correct += G.session.correct;
  S.totals.wrong += G.session.wrong;
  S.totals.sessions++;
  saveState();
  stage.innerHTML = `

      <p style="color:var(--muted);font-size:13px">Session complete · ${total} cartes</p>
      <div class="big">${pct}%</div>

}

function nextCard(){ stopTimer(); G.i++; G.status="idle"; G.flipped=false; G.lastAnswer=""; render(); }
function prevCard(){ stopTimer(); if(G.i>0){G.i--; G.status="idle"; G.flipped=false; render();} }

   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener("keydown", e=>{
  if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if(e.key === " "){ e.preventDefault();
    if(G.mode === "flash") flipCard();
    else if(G.status !== "idle") nextCard();
  }
  if(e.key === "ArrowRight"){ if(G.status !== "idle") nextCard(); }
  if(e.key === "ArrowLeft"){ prevCard(); }
  if(e.key === "p" || e.key === "P"){ const c = G.deck[G.i]; if(c) speak(c.en); }
  if(e.key === "s" || e.key === "S"){ openStats(); }
  if(e.key === "e" || e.key === "E"){ openExport(); }
  if(e.key === "Escape"){ closeModal(); }
});

/* ===== Export builders ===== */
function buildJSON(){ return JSON.stringify(VOCAB, null, 2); }
function csvEscape(s){ s = (s==null?"":String(s)).replace(/"/g,'""'); return /[",\n]/.test(s) ? `"${s}"` : s; }
function buildCSV(){
  const cols = ["English","French","Category","Level","Type","Tags","Explanation","Example1","Example2","IPA","PronunciationTip","Synonyms","Mistakes","MemoryTip"];
  const rows = VOCAB.map(v=>[v.en,v.fr,v.cat,v.lvl,v.type,(v.tags||[]).join("|"),v.exp,v.ex,v.ex2,v.ipa,v.tip,(v.syn||[]).join(", "),v.err,v.mem].map(csvEscape).join(","));
  return cols.join(",") + "\n" + rows.join("\n");
}
function highlightAnki(text, term){
  if(!text || !term) return text || "";
  try{
    const esc = term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return text.replace(new RegExp(`(${esc})`,"gi"),'<b class="hl">$1</b>');
  }catch(e){ return text; }
}
function buildAnkiTSV(){
  // Rich HTML matching the web app. Style lives in card template (Styling tab).
  const rows = VOCAB.map(v=>{
    const front =
      `<div class="bep">`+
        `<div class="tagrow">`+
          `<span class="tag">${v.cat}</span>`+
          `<span class="tag lvl-${v.lvl}">${v.lvl}</span>`+
          `<span class="tag type">${v.type}</span>`+
        `</div>`+
        `<div class="term">${v.en}</div>`+
        `<div class="ipa">${v.ipa}</div>`+
        `<div class="example">"${highlightAnki(v.ex, v.en)}"</div>`+
      `</div>`;
    const back =
      `<div class="bep back">`+
        `<div class="fr">${v.fr}</div>`+
        `<div class="def"><b>Definition.</b> ${v.exp}</div>`+
        `<div class="example">"${highlightAnki(v.ex, v.en)}"</div>`+
        `<div class="example example-2">"${highlightAnki(v.ex2, v.en)}"</div>`+
        `<div class="meta">`+
          `<div class="box tip"><div class="lab">🗣️ Pronunciation (FR)</div><div class="v">${v.tip}</div></div>`+
          `<div class="box err"><div class="lab">⚠️ Common mistake</div><div class="v">${v.err}</div></div>`+
          `<div class="box mem"><div class="lab">🧠 Memory tip</div><div class="v">${v.mem}</div></div>`+
          (v.syn.length?`<div class="box syn"><div class="lab">🔁 Synonyms</div><div class="v">${v.syn.join(", ")}</div></div>`:"")+
        `</div>`+
      `</div>`;
    const tags = (v.tags||[]).map(t=>t.replace(/\s+/g,"_")).join(" ") + " level_" + v.lvl + " cat_" + v.cat.toLowerCase().replace(/\s+/g,"_");
    // single-line cells: strip newlines/tabs from HTML
    const oneLine = s => s.replace(/[\r\n\t]+/g," ");
    return [oneLine(front), oneLine(back), tags].join("\t");
  });
  return "#separator:tab\n#html:true\n#tags column:3\n#notetype:Basic\n#deck:Business English Pro\n" + rows.join("\n");
}

function copyToClipboard(text, label){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast(`✓ ${label} copié`,"ok"));
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(`✓ ${label} copié`,"ok"); }catch(e){ toast("Copie échouée","ko"); }
    ta.remove();
  }
}

    <div style="display:grid;gap:8px;margin-bottom:14px">
      <button class="btn primary" onclick="copyToClipboard(ANKI_CSS,'CSS')">📋 Copier le CSS Anki</button>
      <button class="btn" onclick="copyToClipboard(ANKI_FRONT_TMPL,'Template Recto')">📋 Copier le template <b>Recto</b></button>
      <button class="btn" onclick="copyToClipboard(ANKI_BACK_TMPL,'Template Verso')">📋 Copier le template <b>Verso</b></button>
    </div>
    <details open style="margin-top:6px">
      <summary style="cursor:pointer;color:var(--muted);font-size:13px;font-weight:600">📖 Procédure complète (5 min)</summary>
      <ol style="font-size:12.5px;color:var(--muted);line-height:1.7;margin:10px 0 0 18px">
        <li>Anki Desktop → onglet <b>Parcourir</b> → cliquez une carte du deck.</li>
        <li>Bouton <b>Cartes…</b> (en haut) — éditeur du modèle s'ouvre.</li>
        <li>Onglet <b>Styling</b> → effacez tout → <b>Collez le CSS</b>.</li>
        <li>Onglet <b>Front Template</b> → effacez → collez <code>{{Front}}</code>.</li>
        <li>Onglet <b>Back Template</b> → effacez → collez <code>{{FrontSide}}&lt;hr id="answer"&gt;{{Back}}</code>.</li>
        <li>Cliquez <b>Save</b>. Toutes les cartes adoptent le nouveau style.</li>
        <li><b>Synchronisez</b> → les mobiles AnkiDroid / AnkiMobile reçoivent le style aussi.</li>
      </ol>
    </details>
    <details style="margin-top:12px">
      <summary style="cursor:pointer;color:var(--muted);font-size:13px;font-weight:600">🔄 Mettre à jour les cartes existantes</summary>
      <ol style="font-size:12.5px;color:var(--muted);line-height:1.7;margin:10px 0 0 18px">
        <li>Téléchargez la nouvelle version du <b>.tsv</b> (bouton 🃏 ci-dessous dans Export).</li>
        <li>Anki → <b>Fichier → Importer</b> → sélectionnez le fichier.</li>
        <li>Option <b>Notes existantes</b> → <b>Mettre à jour</b>.</li>
        <li>Importer → 100 notes mises à jour avec le nouveau HTML.</li>
      </ol>
    </details>
  `);
}
function buildMarkdown(){
  let md = "# Business English Pro · 100 Terms\n\n*For French native speakers targeting CSM / AE / SaaS / Cloud / AI roles.*\n\n";
  for(const v of VOCAB){
    md += `## ${v.i}. ${v.en} — *${v.fr}*\n\n`;
    md += `**Category:** ${v.cat} · **Level:** ${v.lvl} · **Type:** ${v.type} · **Tags:** ${(v.tags||[]).join(", ")}\n\n`;
    md += `**IPA:** \`${v.ipa}\`\n\n`;
    md += `**Definition.** ${v.exp}\n\n`;
    md += `> ${v.ex}\n>\n> ${v.ex2}\n\n`;
    md += `- 🗣️ **Pronunciation (FR):** ${v.tip}\n`;
    md += `- ⚠️ **Common mistake:** ${v.err}\n`;
    md += `- 🧠 **Memory tip:** ${v.mem}\n`;
    if(v.syn.length) md += `- 🔁 **Synonyms:** ${v.syn.join(", ")}\n`;
    md += "\n---\n\n";
  }
  return md;
}
function download(name, content, type="text/plain;charset=utf-8"){
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 200);
}

function openExport(){
  openModal(`
    <button class="close" onclick="closeModal()" aria-label="Fermer">×</button>
    <h3>⬇ Export your deck</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px">Exportez les 100 termes au format de votre choix. Pour Anki : ouvrez Anki → Fichier → Importer → choisissez le .tsv.</p>
    <div style="display:grid;gap:8px">
      <button class="btn primary" onclick="download('business-english-anki.tsv', buildAnkiTSV(),'text/tab-separated-values;charset=utf-8')">🃏 Anki TSV (recommandé)</button>
      <button class="btn" onclick="openAnkiTemplate()" style="border-color:rgba(124,92,255,.4);color:#c4b5fd">🎨 Style Anki premium (CSS + template)</button>
      <button class="btn" onclick="download('business-english.csv', buildCSV(),'text/csv;charset=utf-8')">📊 CSV (Excel / Google Sheets)</button>
      <button class="btn" onclick="download('business-english.json', buildJSON(),'application/json')">{ } JSON</button>
      <button class="btn" onclick="download('business-english.md', buildMarkdown(),'text/markdown')">📝 Markdown (dictionnaire)</button>
    </div>
    <details style="margin-top:14px">
      <summary style="cursor:pointer;color:var(--muted);font-size:13px">📖 Instructions Anki</summary>
      <div style="font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:10px">
        1. Ouvrez Anki → <b>Fichier → Importer</b><br>
        2. Sélectionnez <code>business-english-anki.tsv</code><br>
        3. Type: <b>Basic</b> · Field 1 → Front · Field 2 → Back · Field 3 → Tags<br>
        4. Cochez « Allow HTML in fields »<br>
        5. Importer ✓
      </div>
    </details>
  `);
}
