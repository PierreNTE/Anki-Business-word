
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans, system-ui, sans-serif);
    background: transparent;
    color: var(--color-text-primary);
    min-height: 100vh;
    padding: 0;
  }
  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: 1rem 0;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header-left h1 {
    font-size: 14px;
    font-weight: 500;
    color: var(--color-text-secondary);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .header-left p {
    font-size: 12px;
    color: var(--color-text-tertiary);
    margin-top: 2px;
  }
  .stats {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .stat-badge {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    border: 0.5px solid var(--color-border-tertiary);
    color: var(--color-text-secondary);
  }
  .stat-badge.correct { background: #dcfce7; color: #166534; border-color: #86efac; }
  .stat-badge.wrong { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
  .progress-bar {
    height: 3px;
    background: var(--color-border-tertiary);
    border-radius: 2px;
    margin-bottom: 1.25rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #3b82f6;
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .card-container {
    position: relative;
    margin-bottom: 1rem;
  }
  .vocab-card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg, 12px);
    padding: 1.5rem;
    transition: all 0.2s ease;
  }
  .vocab-card.correct-state { border-color: #86efac; background: #f0fdf4; }
  .vocab-card.wrong-state { border-color: #fca5a5; background: #fef2f2; }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .category-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 4px;
    border: 0.5px solid var(--color-border-tertiary);
    color: var(--color-text-secondary);
    background: var(--color-background-secondary);
  }
  .card-num {
    font-size: 12px;
    color: var(--color-text-tertiary);
  }
  .term-section {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1rem;
  }
  .term {
    font-size: 28px;
    font-weight: 500;
    font-family: var(--font-mono, monospace);
    color: var(--color-text-primary);
    flex: 1;
    line-height: 1.2;
  }
  .speak-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.15s ease;
    flex-shrink: 0;
    color: var(--color-text-secondary);
  }
  .speak-btn:hover { background: var(--color-background-tertiary); transform: scale(1.05); }
  .speak-btn:active { transform: scale(0.96); }
  .speak-btn.speaking { color: #3b82f6; border-color: #3b82f6; }
  .example {
    font-size: 13px;
    color: var(--color-text-secondary);
    font-style: italic;
    line-height: 1.6;
    padding: 10px 12px;
    background: var(--color-background-secondary);
    border-radius: 6px;
    border-left: 2px solid var(--color-border-secondary);
    margin-bottom: 1rem;
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .translation-input {
    flex: 1;
    padding: 10px 14px;
    font-size: 15px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md, 8px);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    outline: none;
    transition: border-color 0.15s;
    font-family: var(--font-sans, system-ui, sans-serif);
  }
  .translation-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.12); }
  .translation-input.correct-input { border-color: #22c55e; background: #f0fdf4; color: #166534; }
  .translation-input.wrong-input { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .translation-input:disabled { cursor: default; }
  .btn {
    padding: 10px 16px;
    border-radius: var(--border-radius-md, 8px);
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    font-family: var(--font-sans, system-ui, sans-serif);
  }
  .btn:hover { background: var(--color-background-tertiary); }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #3b82f6; border-color: #3b82f6; color: white; }
  .btn-primary:hover { background: #2563eb; }
  .btn-reveal { font-size: 12px; padding: 8px 12px; color: var(--color-text-secondary); }
  .feedback {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
  }
  .feedback.correct { background: #dcfce7; color: #166534; border: 0.5px solid #86efac; }
  .feedback.wrong { background: #fee2e2; color: #991b1b; border: 0.5px solid #fca5a5; }
  .actions-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    justify-content: flex-end;
  }
  .hint {
    font-size: 12px;
    color: var(--color-text-tertiary);
    margin-top: 8px;
    text-align: center;
  }
  .complete-screen {
    text-align: center;
    padding: 3rem 1rem;
  }
  .complete-screen h2 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 0.5rem;
  }
  .complete-screen p {
    color: var(--color-text-secondary);
    font-size: 15px;
    margin-bottom: 1.5rem;
  }
  .big-score {
    font-size: 48px;
    font-weight: 500;
    margin: 1rem 0;
    font-family: var(--font-mono, monospace);
  }
  .score-green { color: #22c55e; }
  .score-amber { color: #f59e0b; }
  .score-red { color: #ef4444; }
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .filter-btn {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 0.5px solid var(--color-border-tertiary);
    background: transparent;
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-sans, system-ui, sans-serif);
  }
  .filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: white; }
  .filter-btn:hover:not(.active) { background: var(--color-background-secondary); }
</style>
</head>
<body>
<div class="app">
  <h2 class="sr-only">Cloud & AI Sales Vocabulary Game — type the French translation for each English term</h2>
  <div class="header">
    <div class="header-left">
      <h1>Cloud & AI Sales Vocabulary</h1>
      <p id="subtitle">EN → FR · 100 terms · Cloud · AI · CSM · AE</p>
    </div>
    <div class="stats">
      <span class="stat-badge correct" id="stat-correct">✓ 0</span>
      <span class="stat-badge wrong" id="stat-wrong">✗ 0</span>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="filter-row" id="filter-row"></div>
  <div id="main-content"></div>
</div>

<script>

  {term:"TCO",translation:"Coût Total de Possession",alts:["cout total de possession","coût total de possession","tco"],example:"The TCO analysis showed 40% savings versus on-premise.",cat:"Metrics"},

  {term:"Cloud-native",translation:"Natif pour le cloud",alts:["natif pour le cloud","cloud native"],example:"Their cloud-native architecture enables rapid, reliable deployments.",cat:"Cloud"},

  {term:"MEDDIC",translation:"Méthode de qualification MEDDIC",alts:["meddic","methode de qualification","méthode de qualification","meddic qualification"],example:"MEDDIC helped us qualify the opportunity more accurately.",cat:"Sales"},

  {term:"LLM",translation:"Grand Modèle de Langage",alts:["grand modele de langage","grand modèle de langage","llm"],example:"The LLM powers their intelligent customer search feature.",cat:"AI"},

  {term:"Customer success",translation:"Succès Client",alts:["succes client","succès client","customer success"],example:"Customer success means ensuring clients achieve their desired business outcomes.",cat:"Customer Success"},
  {term:"Revenue retention",translation:"Rétention des revenus",alts:["retention des revenus","rétention des revenus"],example:"Net revenue retention above 100% means existing accounts are growing.",cat:"Metrics"},
  {term:"Forecast accuracy",translation:"Précision des prévisions",alts:["precision des previsions","précision des prévisions"],example:"Forecast accuracy above 90% is the mark of a mature sales organization.",cat:"Metrics"}
];

const CATEGORIES = ["All", "Sales", "Cloud", "AI", "Customer Success", "Metrics", "Legal"];

let deck = [];
let currentIndex = 0;
let score = { correct: 0, wrong: 0 };
let status = "idle";
let speaking = false;
let activeCategory = "All";

function normalize(s) {
  return s.toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/['']/g, "'")
    .trim();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck() {
  let filtered = activeCategory === "All" ? vocabulary : vocabulary.filter(v => v.cat === activeCategory);
  deck = shuffle(filtered);
  currentIndex = 0;
  score = { correct: 0, wrong: 0 };
  status = "idle";
  render();
}

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "en-US";
    utt.rate = 0.85;
    utt.pitch = 1;
    speaking = true;
    document.getElementById('speak-btn').classList.add('speaking');
    utt.onend = () => { speaking = false; const b = document.getElementById('speak-btn'); if (b) b.classList.remove('speaking'); };
    utt.onerror = () => { speaking = false; };
    window.speechSynthesis.speak(utt);
  }
}

function checkAnswer() {
  const input = document.getElementById('answer-input');
  if (!input) return;
  const userVal = normalize(input.value);
  if (!userVal) return;
  
  const card = deck[currentIndex];
  const correct = normalize(card.translation);
  const alts = (card.alts || []).map(a => normalize(a));
  const isCorrect = userVal === correct || alts.includes(userVal);
  
  if (isCorrect) {
    score.correct++;
    status = "correct";
  } else {
    score.wrong++;
    status = "wrong";
  }
  updateStats();
  renderCard();
}

function reveal() {
  status = "revealed";
  score.wrong++;
  updateStats();
  renderCard();
}

function next() {
  if (currentIndex < deck.length - 1) {
    currentIndex++;
    status = "idle";
    render();
  } else {
    renderComplete();
  }
}

function updateStats() {
  document.getElementById('stat-correct').textContent = '✓ ' + score.correct;
  document.getElementById('stat-wrong').textContent = '✗ ' + score.wrong;
  const pct = deck.length > 0 ? Math.round(((score.correct + score.wrong) / deck.length) * 100) : 0;
  document.getElementById('progress').style.width = pct + '%';
}

function renderFilters() {
  const row = document.getElementById('filter-row');
  row.innerHTML = CATEGORIES.map(cat => 
    `<button class="filter-btn${cat === activeCategory ? ' active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
  ).join('');
}

function setCategory(cat) {
  activeCategory = cat;
  buildDeck();
}

function renderCard() {
  if (currentIndex >= deck.length) { renderComplete(); return; }
  const card = deck[currentIndex];
  const pct = Math.round(((currentIndex) / deck.length) * 100);
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('subtitle').textContent = `${currentIndex + 1} / ${deck.length} · ${card.cat}`;

  let cardBg = '';
  if (status === 'correct') cardBg = 'correct-state';
  if (status === 'wrong' || status === 'revealed') cardBg = 'wrong-state';
  
  let inputClass = 'translation-input';
  if (status === 'correct') inputClass += ' correct-input';
  if (status === 'wrong' || status === 'revealed') inputClass += ' wrong-input';

  let feedbackHtml = '';
  if (status === 'correct') {
    feedbackHtml = `<div class="feedback correct">✓ Correct ! <strong>${card.translation}</strong></div>`;
  } else if (status === 'wrong') {
    feedbackHtml = `<div class="feedback wrong">✗ Incorrect. La bonne réponse : <strong>${card.translation}</strong></div>`;
  } else if (status === 'revealed') {
    feedbackHtml = `<div class="feedback wrong">💡 Réponse : <strong>${card.translation}</strong></div>`;
  }

  let actionsHtml = '';
  if (status === 'idle') {
    actionsHtml = `
      <div class="actions-row">
        <button class="btn btn-reveal" onclick="reveal()">Révéler</button>
        <button class="btn btn-primary" onclick="checkAnswer()">Valider</button>
      </div>
      <p class="hint">Appuyez sur Entrée pour valider</p>`;
  } else {
    const isLast = currentIndex >= deck.length - 1;
    actionsHtml = `<div class="actions-row"><button class="btn btn-primary" onclick="next()">${isLast ? 'Voir le résultat' : 'Suivant →'}</button></div>`;
  }

  document.getElementById('main-content').innerHTML = `
    <div class="card-container">
      <div class="vocab-card ${cardBg}">
        <div class="card-top">
          <span class="category-badge">${card.cat}</span>
          <span class="card-num">${currentIndex + 1} / ${deck.length}</span>
        </div>
        <div class="term-section">
          <span class="term">${card.term}</span>
          <button class="speak-btn" id="speak-btn" onclick="speak('${card.term.replace(/'/g, "\\'")}');" title="Écouter la prononciation" aria-label="Écouter la prononciation de ${card.term}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </button>
        </div>
        <div class="example">"${card.example}"</div>
        <div class="input-row">
          <input 
            type="text" 
            id="answer-input"
            class="${inputClass}"
            placeholder="Traduction française…"
            ${status !== 'idle' ? 'disabled value="' + (status !== 'revealed' ? document.getElementById('answer-input')?.value || '' : card.translation) + '"' : ''}
            autocomplete="off" autocorrect="off" spellcheck="false"
            aria-label="Entrez la traduction française de ${card.term}"
          />
        </div>
        ${feedbackHtml}
        ${actionsHtml}
      </div>
    </div>`;

  if (status === 'idle') {
    const inp = document.getElementById('answer-input');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
    }
    if (status === 'revealed') {
      const inp2 = document.getElementById('answer-input');
      if (inp2) inp2.value = card.translation;
    }
  }
}

function renderComplete() {
  const total = score.correct + score.wrong;
  const pct = total > 0 ? Math.round((score.correct / total) * 100) : 0;
  let scoreClass = pct >= 80 ? 'score-green' : pct >= 60 ? 'score-amber' : 'score-red';
  let msg = pct >= 80 ? '🎯 Excellent niveau !' : pct >= 60 ? '📈 Bon travail, continue !' : '💪 Continue à t\'entraîner !';
  
  document.getElementById('progress').style.width = '100%';
  document.getElementById('main-content').innerHTML = `
    <div class="complete-screen">
      <h2>${msg}</h2>
      <div class="big-score ${scoreClass}">${pct}%</div>
      <p>${score.correct} correctes · ${score.wrong} incorrectes · sur ${total} cartes</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="buildDeck()">Recommencer (mélangé)</button>
        <button class="btn" onclick="retryWrong()">Revoir les erreurs</button>
      </div>
    </div>`;
}

function retryWrong() {
  deck = shuffle(vocabulary.filter(v => activeCategory === "All" || v.cat === activeCategory));
  currentIndex = 0;
  score = { correct: 0, wrong: 0 };
  status = "idle";
  render();
}

function render() {
  updateStats();
  renderFilters();
  renderCard();
}

buildDeck();
</script>
</body>
</html>
